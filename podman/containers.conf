# Rootless podman configuration for the localserver estate.
# Managed by localserver-config — installed to ~/.config/containers/containers.conf by
# scripts/sudo/bootstrap-host.sh. Marker line below is how the installer recognises its
# own file; do not remove it.
# localserver-managed: podman-networking
#
# WHY THIS EXISTS
#
# Under p-open-east-west (architecture/model.yaml) a container must be able to reach an
# endpoint another container publishes on the host, with no per-pair network configuration.
# How that is achieved depends on the host's container networking:
#
#   Native Linux + rootless podman 5.x (pasta)  — e.g. beeblebox
#     pasta does NOT forward to the host's loopback by default, so a service published on
#     127.0.0.1 is unreachable from a container (verified: "connection refused" from a
#     container to host.containers.internal). --map-host-loopback translates the address
#     pasta already advertises as host.containers.internal (169.254.1.2) to the host's
#     loopback, which makes 127.0.0.1 publishes reachable from containers WITHOUT putting
#     them on the LAN or the tailnet. HOST_INTERNAL_IP is therefore 127.0.0.1 on such hosts.
#
#   WSL2 + rootless podman 4.x (slirp4netns)    — e.g. darragh-laptop
#     This file is inert there (the option applies to pasta). WSL provides a global address
#     on lo (10.255.255.254) that is container-reachable but not LAN-routable, so
#     HOST_INTERNAL_IP is that address instead and no pasta option is needed.
#
# IMPORTANT: pasta options are read when the rootless network namespace is created, which
# happens when the first container starts. Changing this file has no effect on a running
# estate — every container must stop so the namespace is torn down and recreated:
#     podman stop --all --time 30
#     for s in $(grep -vE '^#|^$' compose/stack-order); do ./scripts/start-stack.sh "$s" up; done
[network]
pasta_options = ["--map-host-loopback", "169.254.1.2"]
