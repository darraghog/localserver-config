invariants:
- id: every-service-has-a-tier
  severity: error
  pattern: cardinality
  rule: Every application service has exactly one exposure tier.
- id: every-capability-is-realised
  severity: error
  pattern: cardinality
  rule: Every capability is realised by at least one component or provider.
- id: irreplaceable-data-is-backed-up
  severity: error
  pattern: reachability
  rule: Irreplaceable data reaches only stores that are backed up.
- id: every-vendored-component-names-its-source
  severity: error
  pattern: required_when
  rule: A locally built component names the repository that owns it.
- id: no-orphan-controls
  severity: error
  pattern: cardinality
  rule: Every control protects something and implements a principle.
- id: every-classified-entity-serves-one-pillar
  severity: error
  pattern: named
  rule: Every classified entity has exactly one primary pillar, or a stated exemption.
- id: every-service-offering-has-a-service-level
  severity: warning
  pattern: cardinality
  rule: Every service offering has at least one service level.
- id: every-change-names-what-it-changes
  severity: warning
  pattern: cardinality
  rule: Every change names the configuration item it modifies.
- id: every-incident-names-what-it-concerns
  severity: warning
  pattern: cardinality
  rule: Every incident names the item or service it is about.
- id: every-problem-explains-an-incident
  severity: warning
  pattern: cardinality
  rule: Every problem is the root cause of at least one incident.
- id: high-criticality-change-has-rollback
  severity: warning
  pattern: named
  rule: A change touching a high-criticality service states how to roll back.
- id: every-agent-has-a-purpose
  severity: warning
  pattern: required_when
  rule: Every agent states its purpose.
- id: every-agent-names-its-tools
  severity: warning
  pattern: cardinality
  rule: Every agent names at least one tool it may call.
- id: every-data-product-has-an-owner
  severity: warning
  pattern: required_when
  rule: Every data product names its owner.
- id: every-data-product-has-a-port-and-a-rule
  severity: warning
  pattern: cardinality
  rule: Every data product has an output port and a quality rule.
- id: every-mcp-tool-states-side-effects
  severity: warning
  pattern: required_when
  rule: Every MCP tool states its side effects.
- id: pillar-unserved
  severity: warning
  pattern: named
  rule: A pillar nothing primarily serves is claimed but not acted on.
- id: principle-decorative
  severity: warning
  pattern: named
  rule: A principle that governs nothing and is implemented by nothing is decorative.
- id: entity-orphan
  severity: warning
  pattern: named
  rule: An entity that participates in no relationship.
