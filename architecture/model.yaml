# Baseline architecture of the beeblebox homelab estate.
# Conforms to metamodel.yaml — verify with: python3 scripts/arch-validate.py
#
# This is the BASELINE (as-is), not a target. Known weaknesses are modelled as Gaps
# rather than omitted.
#
# Verified against the running estate 2026-10-06: containers and image tags, systemd units,
# Tailscale serve/funnel, Caddy listeners, Prometheus targets, the Cloudflare edge (terraform
# plan clean), WordPress content counts, the host listeners and the Samba share configuration.
# The WAF .php challenge was confirmed from outside the home network (private browsing on a
# phone with wifi off), since the home egress IP is allow-listed and exempt from the rule.

model:
  name: beeblebox estate
  baseline_date: 2026-10-06
  metamodel_version: 1.1.0

# =============================================================== MOTIVATION ===
Driver:
  - id: d-currency
    name: Stay technically current
    priority: primary
    description: Operate production-grade systems first-hand rather than only reading about them.
    plain_language: >
      Running real systems, with real consequences when they break, is how the technical
      judgement behind leadership decisions stays sharp.
  - id: d-publish
    name: Own the publishing platform
    priority: primary
    description: Publish thelearningcto.com on infrastructure under direct control.
    plain_language: >
      The blog is the public face of this work. Hosting it personally means the content,
      the domain and the audience are not dependent on a platform that can change terms.
  - id: d-frugal
    name: Near-zero recurring cost
    priority: secondary
    description: Prefer free tiers and owned hardware over recurring subscriptions.
    plain_language: >
      The estate should cost little enough that keeping it running is never a budget
      decision — roughly the price of a domain name and a few pence of cloud storage.

Principle:
  - id: p-no-inbound
    name: No inbound ports
    description: The estate is reachable from the internet only via outbound-initiated connections.
    statement: The home network exposes no inbound listening ports to the internet.
    rationale: >
      A residential network has no security team. Every open port is permanent attack
      surface protecting everything else on the LAN, not just the service behind it.
    implication: >
      Public reachability must be achieved by outbound-only connections. Port-forwarding
      is rejected outright, even where it would be simpler.
    plain_language: >
      Nothing on the internet can dial into the house. The house dials out, and traffic
      comes back down that same connection.
  - id: p-tiered-exposure
    name: Exposure is tiered by sensitivity
    description: Reachability from beyond the host is an explicit, recorded property of every endpoint.
    statement: >
      Every endpoint is assigned the narrowest reachability tier beyond the host that still
      serves its purpose.
    rationale: >
      Most services need to be reachable by one person, not by the internet. Defaulting
      to public and then bolting on authentication inverts the safer order.
    implication: >
      New services start private. Publishing one beyond the host is a deliberate, recorded
      decision, and admin interfaces are never published without an identity check in front
      of them. This principle governs reachability from outside beeblebox; traffic between
      workloads already running on it is governed by p-open-east-west.
    plain_language: >
      Each thing is visible to the smallest possible audience outside the server — the whole
      internet, only my own devices, or only the house — and going wider is an explicit choice.
  - id: p-open-east-west
    name: East-west traffic is open
    description: Containers reach each other's published endpoints without per-pair configuration.
    statement: >
      Any container on the host may address any endpoint another container has published;
      no shared network or per-pair grant is required.
    rationale: >
      Per-pair network wiring makes every new internal dependency a change to the provider's
      deployment — friction paid on every integration, to defend a boundary between workloads
      that are already deployed and operated together.
    implication: >
      Applications publish on a host-internal address that containers can reach and the LAN
      and tailnet cannot. Publishing is what makes an endpoint internally reachable, so a port
      left unpublished — a database, say — stays private by default. Internal endpoints must
      not treat network position as authentication. The bias is toward this pattern, but it is
      not absolute: for development convenience a component may publish on 0.0.0.0 instead,
      which also reaches the LAN and tailnet. That is an intentional decision taken per
      network-accessible component and recorded on the component itself (n8n, hello-world and
      Ollama today), not a gap, and a component with no such record is expected to follow the
      principle.
    plain_language: >
      Applications on this server can talk to each other freely, without extra setup for each
      new pair. Nothing outside the server gains anything by it.
  - id: p-ai-cost-to-value
    name: AI spend is tied to value
    description: Spend on AI computation is attributable to the value it produces and bounded by a budget set in advance.
    statement: >
      Spend on AI computation can be attributed to the value it produces, and is bounded by
      an explicit budget set before it is incurred.
    rationale: >
      AI computation is metered per call and cheap per call, so its total is easy to lose track
      of and hard to judge afterwards. A cost nobody can link to an outcome can be neither
      defended nor cut intelligently, and unbounded metering turns a leaked key or a runaway
      loop into an open-ended bill. Tokens are the unit actually consumed and outlast price and
      provider changes better than currency does, so budgets are preferred in tokens.
    implication: >
      AI calls carry an identity (key, team, purpose) so spend can be grouped by what it was
      for; spend that cannot be attributed to a purpose is a defect to fix, not an overhead to
      absorb; every identity has a budget, in tokens where the platform can enforce one and in
      currency otherwise. That makes the gateway the natural enforcement point, since it sees
      every call that passes through it. Today only per-key spend is recorded, and no budget is
      set (gap-no-spend-budget).
    plain_language: >
      Every pound or dollar spent on AI should be traceable to something worth having, and no
      one project or key can spend without a limit agreed beforehand.
  - id: p-rootless
    name: Rootless by default
    description: Workloads hold no host privilege.
    statement: Workloads run as an unprivileged user; root is used only for host setup.
    rationale: A container escape should not yield host root.
    implication: >
      Low ports cannot be bound directly, which forces reverse-proxy patterns; the
      constraint is accepted rather than worked around.
    plain_language: >
      Applications run with the minimum permissions they need, so a compromise of one
      does not hand over the whole machine.
  - id: p-reproducible
    name: Reproducible from source
    description: Configuration is version-controlled; only secrets live outside git.
    statement: The estate is rebuildable from a git repository plus a secrets file.
    rationale: >
      Configuration discovered only by inspecting a running host is lost when that host is.
    implication: >
      Manual changes on the server are defects. Every stack, proxy rule and unit file is
      committed; only secrets live outside version control.
    plain_language: >
      The entire setup is written down as code, so it can be rebuilt from scratch rather
      than remembered.
  - id: p-tested-recovery
    name: Recovery is tested, not assumed
    description: Restorability is demonstrated, not inferred from job success.
    statement: Backups are verified by performing a restore, not by observing that a job succeeded.
    rationale: >
      A backup job reporting success proves a file was written. It says nothing about
      whether the contents can be restored.
    implication: >
      Dumps are checked for completion markers, and restores are exercised against a
      throwaway database and compared to production.
    plain_language: >
      We regularly prove the backups actually work by restoring from them, rather than
      trusting that they do.

# Non-functional domains. The characteristics are disjoint between pillars; an entity may serve
# several (see also_serves). Each carries a boundary_test: the question that settles which
# neighbouring pillar a concern belongs to. Two Drivers (d-currency, d-publish) are not
# non-functional, so Pillars classify what realises a Principle rather than replacing a Driver.
Pillar:
  - id: pl-cost
    name: Cost
    description: Recurring spend and the resources the estate consumes.
    characteristics: >
      Recurring spend, metering, reliance on free tiers, and the hardware and capacity consumed;
      for AI computation, attributing spend to the value it produces and bounding it with
      budgets.
    boundary_test: Is it about money, or about a resource being consumed?
    plain_language: What it costs to keep this running, and how little that can be.
  - id: pl-agility
    name: Agility
    description: The cost and speed of change, including the friction of integrating something new.
    characteristics: >
      Cost and speed of change, integration friction, and the effort of onboarding another
      service or use case.
    boundary_test: Does it make change cheaper or faster, or add friction to it?
    plain_language: How easily something new can be added or an existing thing changed.
  - id: pl-security
    name: Information security
    description: Preventing unauthorised access to, or action on, the estate and the data in it.
    characteristics: >
      Reachability, identity, isolation, hardening and credential hygiene, and the protection
      of data against an adversary (encryption, secret handling). It excludes data governance,
      which is Control and sovereignty.
    boundary_test: >
      Does it matter only because of an adversary? If it would still matter with none -
      custody, residency, retention - it belongs to pl-control.
    plain_language: Keeping the wrong people and programs out, and what they would find if they got in.
  - id: pl-resilience
    name: Resilience
    description: Surviving and recovering from failure, running the estate day to day, and the headroom to grow.
    characteristics: >
      Backup, restore, rebuild and restart; operability (observing, deploying and repairing);
      and scale - the architectural headroom to serve many users, use cases and locations.
      Scale is a design property, not a deployed one: the estate is one node in one house and
      is not expected to realise it (gap-single-node).
    boundary_test: >
      Does it bound the loss or downtime from a fault, make a fault visible and repairable,
      or decide how far the design could grow?
    plain_language: Staying up, getting back up when it falls, and being able to grow if it ever had to.
  - id: pl-quality
    name: AI output quality
    description: Whether the output of model-backed components stays good over time.
    characteristics: >
      Correctness and usefulness of model output, drift and regression, evaluation at build
      time and at runtime, and the effect of a model version changing underneath the estate.
      It does not cover the reliability of the platform itself, which is Resilience.
    boundary_test: Does it concern whether what a model produces stays good?
    plain_language: Whether the answers the AI parts give are still good, and how we would know if they were not.
  - id: pl-control
    name: Control and sovereignty
    description: Authority over the estate's assets, dependencies and behaviour, including compliance.
    characteristics: >
      Data custody, residency, retention and portability; lock-in and the ability to substitute
      a provider; deterministic, auditable behaviour; and compliance with obligations imposed
      from outside. No compliance obligation is currently modelled.
    boundary_test: >
      Would it still matter if no attacker existed? Is it about who holds authority over an
      asset, a dependency or a behaviour?
    plain_language: Owning the things that matter - the address, the data, the way it behaves - rather than renting them from someone who can change terms.

# ================================================================= BUSINESS ===
Capability:
  - id: cap-publishing
    name: Content Publishing
    maturity: defined
    description: Author, host and serve public written content on an owned domain.
    plain_language: Writing and publishing the blog, on our own address.
  - id: cap-automation
    name: Workflow Automation
    maturity: managed
    description: Build and run automated workflows, callable by external AI connectors.
    plain_language: Building small automations that run on a schedule or when something calls them.
  - id: cap-ai-access
    name: Governed AI Model Access
    maturity: managed
    description: Route requests to multiple model providers through one audited gateway.
    plain_language: >
      A single front door to several AI providers, so usage and spend can be seen in one
      place instead of scattered across accounts.
  - id: cap-remote-access
    name: Secure Remote Access
    maturity: defined
    description: Reach private services from anywhere without exposing the home network.
    plain_language: Getting to my own services from anywhere, without leaving a door open at home.
  - id: cap-data-protection
    name: Data Protection and Recovery
    maturity: defined
    description: Protect estate data off-site with verified restoration.
    plain_language: Keeping a safe, tested copy of everything somewhere other than the house.
  - id: cap-domain-services
    name: Domain Ownership and Services
    maturity: defined
    description: >
      Own thelearningcto.com and the services bound to it — authoritative DNS, public web
      addressing, and inbound mail routing.
    plain_language: >
      Owning the web address itself, and everything that hangs off it — the website
      address and the email that arrives at it.
  - id: cap-administration
    name: Estate Administration
    maturity: managed
    description: Observe, deploy and repair the estate.
    plain_language: "Day-to-day running: deploying changes, checking health, fixing faults."
  - id: cap-architecture-knowledge
    name: Architecture Knowledge and AI Governance
    maturity: initial
    description: >
      Keep an ontology-backed model of the estate's services, data products and AI use cases,
      assess AI readiness and risk, and govern changes through human-approved proposals.
    plain_language: >
      Knowing what the estate is made of and which data is fit for AI, and making sure every
      change to that picture is approved by a person.

BusinessService:
  - id: bs-blog
    name: The Learning CTO blog
    criticality: high
    description: Public technical blog at thelearningcto.com; 63 posts spanning 2014-2019 plus current work.
    plain_language: >
      The public website. If it is down, nobody can read the articles; if its content were
      lost, a decade of writing would go with it.
  - id: bs-automation-endpoints
    name: Automation endpoints
    criticality: medium
    description: Publicly callable workflow and MCP endpoints consumed by hosted AI connectors.
    plain_language: >
      Web addresses that let AI assistants trigger my automations. If they break, the
      assistants simply cannot call them.
  - id: bs-llm-gateway
    name: LLM gateway
    criticality: medium
    description: Single authenticated proxy across OpenAI, Anthropic and Google models.
    plain_language: One place to use several AI providers, with a record of what was spent.
  - id: bs-demonstrations
    name: Demonstration applications
    criticality: low
    description: Small published applications used to exercise and prove platform patterns.
    plain_language: >
      Toy applications that exist to prove the platform works. Nobody depends on them.
  - id: bs-domain-email
    name: Domain email forwarding
    criticality: medium
    description: >
      Inbound mail to the domain forwarded to the operator's mailbox via ImprovMX MX records.
    plain_language: >
      Email sent to addresses at the domain arrives in my normal inbox. Nobody notices it
      until it stops — and it is the thing most easily broken by a DNS change.
  - id: bs-administration
    name: Administration and observability
    criticality: medium
    description: Container and host management surface for the operator.
    plain_language: The control panel used to see what is running and fix it.
  - id: bs-architecture-knowledge
    name: Architecture knowledge and change approval
    criticality: low
    description: >
      Views, readiness scores and risk findings over the homelab_arch graph; a build brief for
      AI agents; a proposal queue that only the owner can approve.
    plain_language: >
      A map of the homelab that people can read and AI assistants can ask before they build
      something, with every change waiting for the owner's approval.

Actor:
  - id: act-operator
    name: Operator
    kind: human
    description: Sole administrator, author and owner of the estate.
    plain_language: Me — the only person who administers any of this.
  - id: act-public-reader
    name: Public reader
    kind: human
    description: Anonymous internet visitor to the blog.
    plain_language: Anyone on the internet reading the blog.
  - id: act-ai-connector
    name: Hosted AI connector
    kind: machine
    description: Third-party AI platform infrastructure calling published MCP and webhook endpoints.
    plain_language: >
      AI assistants calling in from outside to run an automation or use a tool.
  - id: act-build-agent
    name: Building AI agent
    kind: machine
    description: >
      AI coding agents (Claude Code and similar) on the owner's tailnet devices or on this host
      that read the build brief over MCP or REST and propose changes; they cannot approve.
    plain_language: >
      AI assistants that check the map before building something, and suggest updates to it
      afterwards for the owner to approve.

# ============================================================== APPLICATION ===
ApplicationComponent:
  - id: ac-wordpress
    name: WordPress
    stack: compose/wordpress
    image: wordpress:7.1-php8.3-apache + mariadb:11.8
    routing: not-path-mounted
    lifecycle: production
    description: Blog platform migrated off WordPress.com, serving thelearningcto.com.
  - id: ac-n8n
    name: n8n
    stack: compose/n8n
    image: n8nio/n8n:2.33.7 + postgres:15-alpine
    routing: not-path-mounted
    lifecycle: production
    description: >
      Workflow automation engine; publishes webhook and MCP trigger endpoints. Intentional
      east-west exception (p-open-east-west): publishes 5678 on 0.0.0.0 rather than the
      host-internal address, so the raw editor also answers on the LAN and tailnet beside
      the Funnel and the Caddy door. Basic auth still applies.
  - id: ac-litellm
    name: LiteLLM
    stack: compose/litellm
    image: ghcr.io/berriai/litellm:main-stable + postgres:16-alpine
    routing: no-strip
    lifecycle: production
    description: Multi-provider LLM proxy with key management and spend tracking.
  - id: ac-weather-mcp
    name: Weather MCP server
    stack: compose/weather-mcp
    image: locally built
    source: ~/dev/claude/weather (vendored by compose/weather-mcp/sync-app.sh)
    routing: strip
    lifecycle: production
    description: MCP tool server with an OAuth-protected public transport and a private GUI.
  - id: ac-cockpit
    name: Cockpit
    stack: (host package, not containerised)
    image: distribution package
    routing: no-strip
    lifecycle: production
    description: >
      Web administration console for the host and its containers. A system service whose
      cockpit.socket Caddy reaches at 127.0.0.1:9090. scripts/sudo/setup-cockpit.sh binds the
      socket to loopback with a systemd drop-in (applied and verified 2026-10-06; the packaged
      default is all interfaces), so Cockpit's own login is reachable only through Caddy.
  - id: ac-tictactoe
    name: Tic-tac-toe
    stack: compose/tic-tac-toe
    image: locally built
    source: in-repo
    routing: strip
    lifecycle: demonstration
    description: Reference app proving path-based routing with a relative API base.
  - id: ac-helloworld
    name: Hello world
    stack: compose/hello-world
    image: nginx:alpine
    source: in-repo
    routing: strip
    lifecycle: demonstration
    description: >
      Smoke-test endpoint used by deployment health checks. Intentional east-west exception
      (p-open-east-west): publishes 8080 on 0.0.0.0, so it answers raw on the LAN and tailnet.
  - id: ac-claudemock
    name: Claude mock test
    stack: compose/claude-mock-test
    image: locally built
    source: ~/dev/claude/mock-test (vendored by compose/claude-mock-test/sync-site.sh)
    routing: strip
    lifecycle: demonstration
    pillar_exemption: >
      Purpose-only (d-currency): a showcase application, kept deliberately. No non-functional
      domain drives it, which is what gap-public-demo-surface records from the other side.
    description: Static practice-exam application; state held entirely in the browser.
  - id: ac-gqldb
    name: Ultipa GQLDB
    stack: compose/gqldb
    image: locally built
    source: >
      Two pinned upstream artifacts, neither of which this repo builds from source:
      the ultipa-gqldb 6.2.131 server binary from download.ultipa.com (sha256-pinned) and
      the GQLDB Manager 1.0.99 .deb (vendor-supplied; the upstream GitHub repo is private).
      scripts/check-updates.py cannot see either pin - both are recorded in
      compose/gqldb/README.md and reviewed by hand.
    routing: not-path-mounted
    lifecycle: experimental
    description: >
      GQL graph database plus its web console, as two containers in one pod. The database
      speaks raw gRPC and is never path-mounted; the console is a normal HTTPS site.
  - id: ac-ollama
    name: Ollama
    stack: (host package, not containerised)
    image: ollama 0.35.0 (system service)
    routing: not-path-mounted
    lifecycle: production
    description: >
      Local model server behind the LLM gateway, listening on 0.0.0.0:11434 (OLLAMA_HOST in the
      unit). Intentional east-west exception (p-open-east-west): litellm's container cannot
      reach a loopback-only listener, so it binds all interfaces. Models are read from the
      Samba Models share by the laptop's own Ollama.
  - id: ac-prometheus
    name: Prometheus
    stack: compose/prometheus
    image: prom/prometheus:v3.5.0 + prom/blackbox-exporter:v0.27.0 + prom/node-exporter:v1.9.1
    routing: no-strip
    lifecycle: production
    description: >
      Metrics store, rule evaluator and probe scheduler. Scrapes metric endpoints where an
      application already exposes them and blackbox-probes the rest; changes no application.
  - id: ac-alertmanager
    name: Alertmanager
    stack: compose/alertmanager
    image: prom/alertmanager:v0.28.1
    routing: not-path-mounted
    lifecycle: production
    description: Groups Prometheus alerts and delivers them to Slack #myagentchannel.
  - id: ac-grafana
    name: Grafana
    stack: compose/grafana
    image: grafana/grafana:12.1.0
    routing: no-strip
    lifecycle: production
    description: Dashboards over Prometheus. Datasource and dashboards are provisioned from git.
  - id: ac-homelab-arch
    name: Homelab Architecture Manager
    stack: compose/homelab-arch
    image: locally built
    source: ~/dev/homelab-arch (vendored by compose/homelab-arch/sync-app.sh)
    routing: not-path-mounted
    lifecycle: experimental
    description: >
      Web app and agent interface (REST + MCP) over the homelab_arch graph in GQLDB: ontology,
      views, readiness and risk, and proposals that only a person can approve. Root-mounted on
      its own tailnet ports because the browser app calls absolute /api paths.

  - id: ac-sshd
    name: OpenSSH server
    stack: (host package, not containerised)
    image: distribution package
    routing: not-path-mounted
    lifecycle: production
    description: >
      Remote shell on :22, listening on every interface. The deploy path (rsync and ssh from
      the laptop) and the operator's way in when Cockpit is not enough, so a host with no
      working sshd can only be repaired at the keyboard.
  - id: ac-samba
    name: Samba
    stack: (host package, not containerised)
    image: distribution package
    routing: not-path-mounted
    lifecycle: production
    description: >
      File sharing on :139/:445, listening on every interface, password-only with no guest
      access. Shares /mnt/windows and its models and games subfolders; the laptop's own Ollama
      reads models from the Models share. The remaining shares are read-write for one account
      (gap-smb-home-share).
  - id: ac-xrdp
    name: xrdp
    stack: (host package, not containerised)
    image: distribution package
    routing: not-path-mounted
    lifecycle: production
    description: Remote desktop on :3389, listening on every interface.

ApplicationService:
  - id: as-blog-public
    name: Blog (public web)
    endpoint: https://thelearningcto.com
    protocol: https
    auth: none
    description: Public read access to blog content.
  - id: as-blog-admin
    name: Blog administration
    endpoint: https://thelearningcto.com/wp-admin
    protocol: https
    auth: edge-identity
    description: WordPress admin, gated by Cloudflare Access before reaching the origin.
  - id: as-n8n-editor
    name: n8n editor and webhooks
    endpoint: https://beeblebox.taile98462.ts.net/
    protocol: https
    auth: basic
    description: Workflow editor plus registered webhook and MCP trigger URLs, root-mounted on :443.
  - id: as-weather-mcp
    name: Weather MCP transport
    endpoint: https://beeblebox.taile98462.ts.net/weather
    protocol: mcp
    auth: oauth
    description: Publicly reachable MCP endpoint; only the authenticated transport paths are published.
  - id: as-weather-gui
    name: Weather GUI
    endpoint: https://beeblebox.taile98462.ts.net:8090/weather
    protocol: https
    auth: network-identity
    description: Unauthenticated GUI, kept private precisely because it is unauthenticated.
  - id: as-litellm-ui
    name: LiteLLM admin console
    endpoint: https://beeblebox.taile98462.ts.net:8090/litellm/ui/
    protocol: https
    auth: basic
    description: Operator console for keys, models and spend — an administrative surface,
      not the gateway itself, which is why it delivers administration rather than the LLM
      gateway. Path-mounted on the tailnet router via SERVER_ROOT_PATH; the dedicated :8092
      port is retained as a fallback until the mount has proven itself.
  - id: as-litellm-api
    name: LiteLLM OpenAI-compatible API
    endpoint: https://beeblebox.taile98462.ts.net:8090/litellm/v1
    protocol: https
    auth: api-key
    description: The gateway proper — /v1/chat/completions and the rest — authenticated by
      the master key or a virtual key, not by the console's login. Intended for east-west use
      by components on beeblebox (http://127.0.0.1:4000/litellm/v1); it answers more widely
      than that today, which gap-litellm-api-reach records. Any route that later needs
      internet exposure for an integration gets its own service entry and its own tier.
  - id: as-cockpit
    name: Cockpit console
    endpoint: https://beeblebox.taile98462.ts.net:8090/cockpit/
    protocol: https
    auth: basic
    description: Host administration console, reachable only over the tailnet.
  - id: as-claudemock
    name: Claude mock test (public)
    endpoint: https://beeblebox.taile98462.ts.net/claudemock
    protocol: https
    auth: none
    description: Published deliberately; holds no data and makes no outbound calls.
  - id: as-demos-private
    name: Demonstration apps (private)
    endpoint: https://beeblebox.taile98462.ts.net:8090/{tictactoe,helloworld}
    protocol: https
    auth: network-identity
    description: Demo apps on the tailnet path router.
  - id: as-gqldb-manager
    name: GQLDB Manager console
    endpoint: https://beeblebox.taile98462.ts.net:8098/
    protocol: https
    auth: basic
    description: >
      Web console for the graph database - browsing graphs, running GQL, managing users.
      Given its own entry rather than folded into as-lan-consoles because it authenticates
      callers itself rather than relying on the network it is reachable from. On a dedicated
      port rather than the :8090 path router because its client fetches an absolute
      /assets/... bundle and the server has no base-path setting, so no prefix mount can
      work; the router's index page links here instead. The LAN door on :8450 is the
      break-glass path covered by as-lan-consoles.
  - id: as-gqldb
    name: GQLDB gRPC endpoint
    endpoint: grpc://127.0.0.1:60061
    protocol: grpc
    auth: basic
    description: >
      The database wire protocol: RBAC login returns a session id carried in gRPC metadata.
      Deliberately unpublished beyond the host - its only caller is the console beside it.
      Outside callers use as-gqldb-tls instead.
  - id: as-gqldb-tls
    name: GQLDB gRPC endpoint (TLS door)
    endpoint: grpcs://beeblebox:8451
    protocol: grpc
    auth: basic
    description: >
      The same wire protocol behind a Caddy listener that terminates TLS (private CA) and
      speaks h2c to the database, for gqldb-cli and apps outside the host. Bound 0.0.0.0 like
      every :84xx door, so it answers on the LAN and on the tailnet IP (verified 2026-09-30
      for :8450). The metamodel allows one tier per endpoint, so the wider one (tailnet) is
      recorded; LAN reach is a side effect of the bind, not a separate route. RBAC login is
      the only credential. The certificate must carry whatever name
      the client dials - the short name is already a SAN, the ts.net FQDN is not unless added
      via DEPLOY_CERT_EXTRA_SANS.
  - id: as-ollama
    name: Ollama API
    endpoint: http://beeblebox:11434
    protocol: http
    auth: none
    description: >
      Ollama's native API, unauthenticated, bound 0.0.0.0 so it answers on the LAN and on the
      tailnet IP; the wider of the two (tailnet) is recorded. Its caller is litellm; gap-ollama-reach
      records that anyone on either network can also call it.
  - id: as-lan-consoles
    name: LAN service endpoints
    endpoint: https://beeblebox:8443-8450, :9443
    protocol: https
    auth: network-identity
    description: >
      Direct per-service HTTPS ports on the home LAN, using a private CA. Includes the GQLDB
      console's :8450 break-glass door; its designed route is the tailnet port in
      as-gqldb-manager.
  - id: as-prometheus
    name: Prometheus UI and API
    endpoint: https://beeblebox.taile98462.ts.net:8090/prometheus/
    protocol: https
    auth: network-identity
    description: Query UI and API on the tailnet path router. Also answers east-west on the host-internal port.
  - id: as-alertmanager
    name: Alertmanager API
    endpoint: http://127.0.0.1:8101
    protocol: http
    auth: none
    description: >
      Host-internal only; Prometheus is its only caller. No Caddy route, so it is not reachable
      from the LAN or tailnet. Unauthenticated east-west like every published endpoint.
  - id: as-grafana
    name: Grafana
    endpoint: https://beeblebox.taile98462.ts.net:8090/grafana/
    protocol: https
    auth: basic
    description: Dashboards on the tailnet path router; authenticates callers itself.
  - id: as-homelab-arch-ui
    name: Homelab Architecture Manager (people)
    endpoint: https://beeblebox.taile98462.ts.net:8099/
    protocol: https
    auth: basic
    description: >
      Browser app and API for the owner. Production runs HLA_HUMAN_AUTH=tailnet-trust (proof
      of concept, owner decision): Caddy :8099 adds the approver header with no password, so
      any tailnet device or local process can approve (accepted risk). HLA_HUMAN_AUTH=basic
      requires the owner's password first (documented in compose/homelab-arch/README.md).
  - id: as-homelab-arch-mcp
    name: Homelab Architecture Manager (agents)
    endpoint: https://beeblebox.taile98462.ts.net:8105/mcp
    protocol: mcp
    auth: api-key
    description: >
      MCP endpoint and /api/agent/* for AI agents, bearer AGENT_API_TOKEN. Caddy :8105 forwards
      nothing else (404) and strips the approver headers, so agents cannot approve.
  - id: as-homelab-arch-internal
    name: Homelab Architecture Manager (east-west)
    endpoint: http://127.0.0.1:8104
    protocol: http
    auth: none
    description: >
      The app port for containers on this host (host.containers.internal:8104). The read API is
      unauthenticated here (gap-flat-east-west); agent routes need the agent token and approval
      routes the approver token, which only Caddy :8099 adds.

# ==================================================================== DATA ===

  - id: as-ssh
    name: SSH
    endpoint: ssh://beeblebox:22
    protocol: ssh
    auth: ssh-key
    description: >
      Operator shell and deploy transport. Answers on the LAN as well as the tailnet; tiered
      with the other every-interface host services (compare as-ollama).
  - id: as-samba
    name: SMB file shares
    endpoint: smb://beeblebox (:139, :445)
    protocol: smb
    auth: basic
    description: >
      Password-only shares, no guest. Answers on the LAN as well as the tailnet.
  - id: as-xrdp
    name: Remote desktop
    endpoint: rdp://beeblebox:3389
    protocol: rdp
    auth: basic
    description: Desktop login with a host account. Answers on the LAN as well as the tailnet.

DataEntity:
  - id: de-blog-content
    name: Blog content
    classification: public
    recoverability: irreplaceable
    description: Posts, pages, taxonomy and comments — 63 posts, 3 pages, 29 attachments.
    plain_language: A decade of published writing. Public to read, but impossible to recreate if lost.
  - id: de-media-assets
    name: Media assets
    classification: public
    recoverability: irreplaceable
    description: Uploaded images and generated derivatives under wp-content.
    plain_language: The images used in posts.
  - id: de-workflow-definitions
    name: Workflow definitions and credentials
    classification: confidential
    recoverability: irreplaceable
    description: n8n workflows plus credentials encrypted at rest with N8N_ENCRYPTION_KEY.
    plain_language: >
      The automations themselves, and the saved logins they use. The logins are scrambled
      with a key that must be kept separately — without it they can never be read again.
  - id: de-llm-usage
    name: LLM keys and usage history
    classification: secret
    recoverability: irreplaceable
    description: Virtual API keys and accumulated spend/usage records.
    plain_language: AI provider keys and the record of what has been spent.
  - id: de-oauth-tokens
    name: Issued OAuth tokens
    classification: secret
    recoverability: recoverable
    description: Tokens issued by the weather MCP authorisation server; reissuable.
    plain_language: Access passes handed to AI tools; they can simply be reissued.
  - id: de-graph-data
    name: Graph datasets
    classification: internal
    recoverability: irreplaceable
    description: >
      Nodes, edges, labels and indexes held in GQLDB graphs, plus the RBAC users in
      __system__. Built up interactively rather than loaded from a source of record.
    plain_language: >
      The graphs themselves. Built by hand over time, so there is nowhere to reload them
      from if they are lost.
  - id: de-manager-config
    name: Manager connections and users
    classification: secret
    recoverability: recoverable
    description: >
      Saved database connections and console logins. Connection passwords are encrypted at
      rest with ENCRYPTION_KEY, the same arrangement as N8N_ENCRYPTION_KEY in
      de-workflow-definitions - without that key they cannot be read again, and the recovery
      is to delete and re-create the connection rather than to recover the secret.
    plain_language: >
      Which databases the console knows about and who may log in. Scrambled with a key kept
      in the secrets file; if that key is lost the saved logins are simply re-entered.
  - id: de-platform-secrets
    name: Platform secrets
    classification: secret
    recoverability: irreplaceable
    description: >
      .env — N8N_ENCRYPTION_KEY, database passwords, provider API keys, the Cloudflare API
      token used by cloudflare/ — plus tunnel
      credentials and the private CA. Gitignored, so it exists nowhere else.
    plain_language: >
      The master key file. Losing it makes several of the backups permanently unreadable,
      which is why it matters more than anything else here.
  - id: de-monitoring-state
    name: Alerting and dashboard state
    classification: internal
    recoverability: recoverable
    description: Alertmanager silences and Grafana's own database. Configuration is in git; this is only runtime state.
  - id: de-monitoring-metrics
    name: Monitoring time series
    classification: internal
    recoverability: recoverable
    description: Fifteen days of scraped metrics. Disposable by design; nothing is lost that matters if it is.
  - id: de-architecture-proposals
    name: Architecture change proposals and audit log
    classification: internal
    recoverability: irreplaceable
    description: >
      Proposed, approved and rejected changes to the homelab_arch graph with their undo log and
      an append-only audit trail of who decided what.
    plain_language: >
      The record of every suggested change to the map and who approved it. It cannot be
      rebuilt from anywhere else.

DataStore:
  - id: ds-wordpress-db
    name: WordPress database
    technology: MariaDB 11.8
    backup_method: logical-dump
    description: mariadb-dump --single-transaction, so the blog keeps serving during backup.
  - id: ds-n8n-db
    name: n8n database
    technology: PostgreSQL 15
    backup_method: logical-dump
    description: pg_dump of the n8n database; credentials inside remain encrypted at rest.
  - id: ds-litellm-db
    name: LiteLLM database
    technology: PostgreSQL 16
    backup_method: logical-dump
    description: pg_dump of the LiteLLM database holding virtual keys and spend history.
  - id: ds-wp-content
    name: WordPress site tree
    technology: Podman volume
    backup_method: file-copy
    description: The whole /var/www/html including wp-config.php, not merely uploads.
  - id: ds-n8n-data
    name: n8n instance data
    technology: Podman volume
    backup_method: file-copy
    description: n8n's instance directory; safe to copy as files since state lives in Postgres.
  - id: ds-oauth-store
    name: OAuth token store
    technology: Podman volume
    backup_method: file-copy
    description: Small JSON store of issued tokens.
  - id: ds-gqldb
    name: GQLDB graph store
    technology: Ultipa GQLDB 6.2.131 (LSM)
    backup_method: logical-dump
    description: >
      BACKUP DATABASE has the server write its own verified archive while serving; the LSM
      directory is never file-copied. The archives are written to the gqldb-backups volume,
      collected by backup.sh into the staging directory, and are not themselves a backup.
  - id: ds-manager
    name: GQLDB Manager store
    technology: GQLDB embedded via NAPI (LSM), Podman volume
    backup_method: file-copy
    description: >
      The console's own embedded store. It has no dump command, so the container is stopped
      for the copy - a cold copy, not a copy of a running database directory.
  - id: ds-secrets
    name: Secrets and credentials
    technology: Host filesystem (.env, ~/.cloudflared, certs/)
    backup_method: file-copy
    description: Included in the encrypted snapshot; the reason encryption is load-bearing.
  - id: ds-alertmanager
    name: Alertmanager state
    technology: Podman volume
    backup_method: none
    description: Silences and the notification log; recreated empty if lost, at the cost of re-silencing.
  - id: ds-grafana
    name: Grafana state
    technology: Podman volume
    backup_method: none
    description: >
      Grafana's own database (sessions, users, ad-hoc edits). Datasource and dashboards are
      provisioned from git, so only changes made in the UI are lost with it.
  - id: ds-prometheus-tsdb
    name: Prometheus TSDB
    technology: Podman volume
    backup_method: none
    description: Deliberately not backed up - metrics are disposable and rebuilt from the next scrape.
  - id: ds-homelab-arch-proposals
    name: homelab-arch proposals database
    technology: SQLite on Podman volume homelab-arch_proposals-data
    backup_method: logical-dump
    description: >
      Online SQLite backup made inside the container and integrity-checked
      (compose/homelab-arch/backup.sh), collected by backup.sh; the volume is never file-copied.

# ============================================================== TECHNOLOGY ===
Node:
  - id: n-beeblebox
    name: beeblebox
    location: home
    spec: Ubuntu 26.04, 12 cores, 30 GB RAM, 1.1 TB NVMe
    description: >
      Sole server. Runs every application component, including the host services SSH, Samba
      and xrdp (ac-sshd, ac-samba, ac-xrdp). Also runs CUPS (loopback :631), which is neither
      critical nor reachable from outside the host and so is not modelled.
  - id: n-laptop
    name: darragh-laptop
    location: home
    spec: Windows + WSL2, Podman
    description: Development and deployment workstation; runs no production workload.
  - id: n-mobile
    name: Mobile devices
    location: mobile
    spec: iOS
    description: Tailnet members providing operator access away from home.

TechnologyService:
  - id: ts-podman
    name: Container runtime
    product: Podman 5.7.0 (rootless) + podman-compose
    description: Runs every application component as an unprivileged user.
  - id: ts-caddy
    name: Reverse proxy and TLS termination
    product: Caddy (host network)
    description: >
      Single ingress point; every tier's routing rules are expressed here. Also serves its
      own /metrics on host-internal :8103, and Prometheus, Alertmanager and Grafana expose
      theirs on :8101 and :8102, none reachable from the LAN or tailnet.
  - id: ts-systemd
    name: Service lifecycle and scheduling
    product: systemd user units with loginctl linger
    description: >
      Starts stacks at boot without login, drives the weekly backup timer, and runs the
      unit-metrics timer whose textfile metric feeds the SystemdUserUnitFailed alerts.
  - id: ts-tailscale
    name: Mesh VPN and public funnel
    product: Tailscale
    description: Provides private device-identity reachability and the public *.ts.net ingress.
  - id: ts-cloudflared
    name: Outbound tunnel connector
    product: cloudflared
    description: Dials out to Cloudflare so the blog is public with no inbound port.
  - id: ts-restic
    name: Backup engine
    product: restic 0.19.1 (containerised)
    description: Client-side encrypted, deduplicating, weekly with 12-week retention.

Network:
  - id: net-internet
    name: Public internet
    trust: untrusted
    description: Anonymous callers; the zone the public tiers are addressable from.
  - id: net-tailnet
    name: Tailnet
    trust: authenticated
    description: WireGuard mesh; membership is identity, so reachability implies authentication.
  - id: net-home-lan
    name: Home LAN
    trust: trusted
    description: 192.168.86.0/24 behind Google Wi-Fi and a bridged Verizon FIOS router.
  - id: net-container
    name: Container network
    trust: trusted
    description: >
      The podman bridge networks and the host-internal address they reach. Membership is
      being a workload on beeblebox; there is no boundary between members.

ExternalProvider:
  - id: ep-cloudflare
    name: Cloudflare
    function: Authoritative DNS, tunnel ingress, edge TLS, Access identity gating
    cost: free tier
    lock_in: medium
    description: >
      Holds the domain's DNS and fronts the blog. Substitutable, but doing so means
      re-establishing DNS, tunnel and the admin identity gate together.
  - id: ep-tailscale
    name: Tailscale
    function: Mesh VPN, private service reachability, public Funnel ingress
    cost: free tier
    lock_in: medium
    description: Carries both the private tier and the machine-facing public tier.
  - id: ep-slack
    name: Slack
    function: Alert delivery to #myagentchannel via chat.postMessage
    cost: free tier
    lock_in: low
    description: >
      Outbound-only HTTPS from Alertmanager. Substitutable by any notifier Alertmanager
      supports; the bot token is the one secret involved.
  - id: ep-azure-blob
    name: Azure Blob Storage
    function: Off-site encrypted backup repository
    cost: pennies/month (Cool tier)
    lock_in: low
    description: restic abstracts the backend; substituting for S3 is a configuration change.
  - id: ep-amazon-registrar
    name: Amazon Registrar
    function: Domain registration for thelearningcto.com
    cost: ~annual domain fee
    lock_in: low
    description: Registrar of record; delegates DNS to Cloudflare nameservers.
  - id: ep-improvmx
    name: ImprovMX
    function: Inbound email forwarding for the domain
    cost: free tier
    lock_in: low
    description: Forwards mail addressed to the domain; depends on MX records surviving DNS changes.
  - id: ep-github
    name: GitHub
    function: Configuration source of truth
    cost: free tier
    lock_in: low
    description: Remote of the localserver-config repository that defines the estate.
  - id: ep-model-providers
    name: Model providers
    function: OpenAI, Anthropic and Google inference APIs consumed via LiteLLM
    cost: metered usage
    lock_in: low
    description: >
      Upstream model APIs; the only metered cost in the estate. Reached only through LiteLLM,
      across three providers, which is what keeps substitution cheap and lock-in low.

  - id: ep-langsmith
    name: LangSmith
    function: Trace capture and automated evaluation (build time and runtime) for LLM applications
    cost: per account plan; tier not recorded
    lock_in: low
    description: >
      Operator's account, in use today by Python applications running outside the estate (the
      development workstation), which send traces to it. No component deployed on beeblebox
      uses it yet (gap-ai-evals-not-adopted). Reaching it from a container is outbound HTTPS
      only, so p-no-inbound is unaffected, and it is the same path litellm already uses to reach
      the model providers; the repo records no egress filtering. What it does change: prompts
      and outputs leave the estate for a third party, so what a workflow or app sends is a
      data-custody decision (pl-control), and each tracing client needs its own API key in
      .env. LiteLLM has a LangSmith callback, which would make the gateway the single egress
      point and the single key for every caller using it.

# ============================================================== EXTENSIONS ===
ExposureTier:
  - id: et-public-cloudflare
    name: Public via Cloudflare
    reachable_from: The entire internet
    enforced_by: Cloudflare edge; admin paths additionally gated by Access
    description: Custom-domain public tier. The only tier serving thelearningcto.com.
    plain_language: Anyone in the world can reach this.
  - id: et-public-funnel
    name: Public via Tailscale Funnel
    reachable_from: The entire internet
    enforced_by: Tailscale Funnel on the *.ts.net hostname
    description: >
      Public tier for machine callers. Cannot serve a custom domain, which is precisely
      why the blog needed Cloudflare instead.
    plain_language: Also reachable by anyone, but on a technical address rather than a friendly one.
  - id: et-tailnet
    name: Tailnet only
    reachable_from: Devices enrolled in the tailnet
    enforced_by: Tailscale device identity
    description: Default tier for anything with an admin surface or unauthenticated routes.
    plain_language: Only my own enrolled devices can reach this, from anywhere in the world.
  - id: et-lan
    name: Home LAN only
    reachable_from: Devices on the home network
    enforced_by: Caddy listeners bound to the LAN with a private CA
    description: Break-glass access path; not the designed route for any service.
    plain_language: Only reachable from inside the house.
  - id: et-loopback
    name: Host internal only
    reachable_from: beeblebox itself, and any container running on it
    enforced_by: Bind to a host-internal address that is neither LAN- nor tailnet-routable
    description: >
      Where every application actually listens. Reaching it requires already being on
      beeblebox — as the host, or as a workload it is running.
    plain_language: >
      Not reachable from outside the server — only from the server and the applications
      it runs.

Control:
  - id: ctl-access-gate
    name: Cloudflare Access on admin paths
    type: preventive
    description: >
      Email OTP challenge at the edge for /wp-admin and /wp-login.php, so brute-force
      traffic never reaches PHP. Two Access apps (one per path), each carrying only the
      admin-email policy, managed in cloudflare/main.tf. Until 2026-10-05 both also carried an
      "Everyone" allow policy, which admits anyone who completes an IdP login (including
      One-time PIN with any inbox), so the gate was open; allow policies are OR'd, so the
      Terraform deliberately attaches no other policy.
  - id: ctl-tailnet-identity
    name: Tailnet device identity
    type: preventive
    description: Reachability requires an enrolled device, making network position the first auth factor.
  - id: ctl-rootless
    name: Rootless containers
    type: preventive
    description: Workloads run as uid 1000; a container escape does not yield host root.
  - id: ctl-encrypted-backup
    name: Client-side backup encryption
    type: preventive
    description: >
      restic encrypts before upload, so the storage provider — and anyone holding only the
      storage key — cannot read the secrets in the snapshot.
  - id: ctl-offsite-copy
    name: Weekly off-site copy
    type: recovery
    description: Weekly snapshot to Azure Blob, 12-week retention, surviving loss of the house.
  - id: ctl-dump-verification
    name: Dump completion verification
    type: detective
    description: >
      Each dump is checked for its terminator, because a dump truncated midway still
      produces a valid compressed file.
  - id: ctl-restore-rehearsal
    name: Restore rehearsal
    type: detective
    description: >
      Restores are loaded into a throwaway database and compared row-for-row with
      production.
  - id: ctl-published-surface
    name: Minimum published surface
    type: preventive
    description: >
      Public fronts publish only what must be public — an allowlist for the MCP transport,
      and xmlrpc.php blocked outright.
  - id: ctl-edge-waf
    name: Cloudflare WAF and HTTPS enforcement
    type: preventive
    description: >
      A custom WAF rule issues a managed challenge for requests to stray .php files
      (wp-login.php, wp-cron.php, xmlrpc.php and /wp-admin/ excepted; the live action is
      managed_challenge, not block - see waf_php_action in cloudflare/terraform.tfvars), a skip rule lets the blackbox uptime probe's
      GET / past it, and always-use-https is on - the only place http to https happens,
      because Caddy :8097 hardcodes X-Forwarded-Proto https. All in cloudflare/main.tf.

Gap:
  - id: gap-single-node
    name: Single point of failure
    severity: high
    status: accepted
    description: >
      Every production workload runs on one machine in one house. Backups make the data
      survivable; the service does not. Recovery is measured in hours of rebuild.
    plain_language: >
      Everything runs on one computer at home. If it fails, the services are down until
      it is rebuilt — though nothing is permanently lost.
  - id: gap-no-alerting
    name: Alerting limited to probes, host resources, unit failures and certificates
    severity: low
    status: mitigated
    description: >
      Prometheus probes every stack and public URL, watches host disk, memory and CPU, failed
      systemd user units and the Caddy certificate, and Alertmanager posts failures to Slack #myagentchannel.
      Still uncovered: backup age (the backup scripts emit no metric), application-level
      errors in apps that expose no metrics, and a host-wide outage - the alert pipeline
      runs on the host it watches (gap-single-node), so nothing reports that the whole box
      is down. n8n and GQLDB are probe-only by decision: n8n's /metrics would be public on
      the Funnel, and GQLDB's metrics listener exposes unauthenticated /debug/pprof.
    plain_language: >
      Something now tells me when a service, a website or the disk is in trouble. It cannot
      tell me if the whole server is off, and it does not yet watch the backups.
  - id: gap-residential-connectivity
    name: Residential connectivity
    severity: medium
    status: accepted
    description: Availability is bounded by a domestic ISP and household power.
  - id: gap-no-secret-rotation
    name: No secret rotation
    severity: medium
    status: accepted
    description: >
      Long-lived provider keys and a storage account key sit in .env with no rotation
      schedule. A SAS token scoped to the backup container is the identified improvement.
      homelab-arch adds two more (HLA_APPROVER_TOKEN, AGENT_API_TOKEN, also in .env), and
      podman-compose passes them to `podman create` as `-e NAME=value` arguments, so they are
      briefly visible in the host process list and in `podman inspect` to local users of the
      server (no env_file or secret store is available in this podman-compose version). Local
      accounts are treated as inside the trust boundary; rotate the tokens if that stops being true.
  - id: gap-public-demo-surface
    name: Demonstration apps published
    severity: low
    status: accepted
    description: >
      claude-mock-test is served on the public Funnel. Accepted because it holds no data
      and makes no outbound calls, and because it is kept deliberately as a showcase — but it
      is still published surface that no non-functional requirement calls for.
  - id: gap-no-staging
    name: No staging environment
    severity: low
    status: accepted
    description: Changes are validated by deploying to production and verifying afterwards.
  - id: gap-litellm-api-reach
    name: LLM gateway API reachable beyond its intended scope
    severity: low
    status: accepted
    description: >
      The API is intended to be east-west only, called by components running on beeblebox.
      Caddy proxies the whole app, so /v1 also answers on the LAN (:8447) and on the tailnet
      (:8090/litellm and :8092) alongside the console. Every route is key-authenticated, so
      this widens who may present a key rather than removing the check. Narrowing it means an
      allowlist on those sites — the pattern the :8095 site already uses for weather-mcp.
      The one exception is /litellm/metrics, which is unauthenticated east-west for
      Prometheus and is answered 404 by Caddy on :8447, :8092 and :8090.
    plain_language: >
      The AI gateway can be called from more places than intended, though a key is still
      needed to use it.
  - id: gap-flat-east-west
    name: No isolation between co-located workloads
    severity: medium
    status: accepted
    description: >
      Any container can reach any endpoint another container publishes, so a compromise of
      one workload reaches the internal surface of all of them. Most published endpoints
      authenticate their callers — litellm on virtual keys, n8n on basic auth — but
      weather-mcp's bearer check wraps only its /mcp mount, leaving its GUI and /api/*
      routes unauthenticated and now reachable from every other container.
    plain_language: >
      If one application on the server were broken into, it could talk to the others.
      Accepted in exchange for not having to wire up every connection by hand.
  - id: gap-smb-home-share
    name: Samba shares the operator's home directory read-write
    severity: medium
    status: mitigated
    description: >
      The DaraDoom share mapped /home/daradoom read-write, with force user daradoom, on every
      interface and with no hosts allow, so it answers on the LAN and tailnet. There is no guest
      access (map to guest = Never, anonymous tree connects were refused), but the one account's
      password therefore gave read-write access to .env (the master keys) and ~/.ssh, including
      authorized_keys, which turns SMB access into a shell as the account that owns every stack.
      Mitigated 2026-10-06: the share is removed (the laptop only mounts Models), restrict
      anonymous = 2 is set, and the include in smb.conf now sits below the global parameters, so
      workgroup, disable netbios, socket options and multichannel take effect. Residual: the
      remaining shares are still read-write for the same single account on the LAN and tailnet.
    plain_language: >
      One password used to open my whole home folder from anywhere on the home network, including
      the file of master keys. That folder is no longer shared.
  - id: gap-ollama-reach
    name: Ollama API unauthenticated and reachable beyond litellm
    severity: low
    status: accepted
    description: >
      Ollama has no authentication and is bound 0.0.0.0 so litellm's container can reach it, so
      any device on the LAN or tailnet can run inference or pull and delete models. Accepted as
      part of the per-component east-west decision on ac-ollama; narrowing it means binding to
      the host-internal address, which litellm can reach through pasta's host-loopback mapping.
    plain_language: >
      Anyone on my home network or my own devices can use the local AI model directly, without
      going through the gateway or a key.
  - id: gap-edge-state-local
    name: Cloudflare edge state is local and applied by hand
    severity: low
    status: accepted
    description: >
      cloudflare/terraform.tfstate is a gitignored local file on the laptop and is not in
      the backup; if lost, the edge must be re-imported. Applies are manual (deploy only
      plans and warns on drift). The IP Access Rule allowing the probe's egress IP goes
      stale when the residential address changes, and the zone's single custom-rules
      ruleset is owned wholesale by Terraform, so any rule added in the dashboard is
      removed by the next apply.
  - id: gap-ai-evals-not-adopted
    name: Estate components are not traced or evaluated
    severity: low
    status: accepted
    description: >
      LangSmith is deployed (ep-langsmith) and Python applications outside the estate already
      send traces to it, but nothing running on beeblebox does, and the LiteLLM gateway has no
      LangSmith callback configured. So no estate component has its output traced or evaluated
      at build time or runtime, and a provider changing a model, or an Ollama model replaced by
      hand, would go unnoticed. LiteLLM's documented callback (`callbacks: ["langsmith"]`,
      LANGSMITH_API_KEY, optional LANGSMITH_BASE_URL) is the lowest-effort route, covering every
      caller through the gateway; see ep-langsmith for the networking and data-custody
      implications. Runtime evaluation would build on the observability stack that already
      serves Resilience.
      The tool for checking the AI parts' answers exists and is in use elsewhere, but none of
      the estate's own AI components use it yet.
  - id: gap-no-spend-budget
    name: AI spend is neither budgeted nor tied to value
    severity: medium
    status: planned
    description: >
      Model-provider usage is the only metered cost and nothing bounds it: LiteLLM records
      spend per virtual key (de-llm-usage), but no limit is set, so a leaked or runaway key
      spends until someone notices, and the model records spend per key rather than the value
      that spend produced (p-ai-cost-to-value). The control is defined but not implemented.
      Intended shape, per LiteLLM's documented budgets: a global `litellm_settings.max_budget`
      and `budget_duration`, plus a `max_budget` and `budget_duration` on every virtual key, so
      requests fail once a cap is crossed (enforced against spend in the existing Postgres,
      ds-litellm-db); `team_id`, `key_alias` and `metadata` on keys to attribute spend to a
      purpose; provider-side caps as a backstop; and an alert when spend nears a cap. The
      principle prefers token budgets, but as I read LiteLLM's documentation it enforces only
      a currency cap (`max_budget`) and per-minute rate limits (`tpm_limit`, `rpm_limit`), not
      a cumulative token cap - a token budget would need enforcing elsewhere, or a currency
      cap used as the nearest proxy. Amounts are the operator's to set. When implemented it
      will be a Control implementing p-ai-cost-to-value.
      Nothing stops the AI bill from running away if a key leaks, and nobody can yet say what
      value a given key's spending bought. A monthly cap is designed but not switched on.

