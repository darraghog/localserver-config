    than relying on the network it is reachable from. On a dedicated port rather than the :8090 path router
    because its client fetches an absolute /assets/... bundle and the server has no base-path setting,
    so no prefix mount can work; the router''s index page links here instead. The LAN door on :8450 is
    the break-glass path covered by as-lan-consoles.

    '
  endpoint: https://beeblebox.taile98462.ts.net:8098/
  protocol: https
  auth: basic
- id: as_gqldb_tls
  name: GQLDB gRPC endpoint (TLS door)
  description: 'The same wire protocol behind a Caddy listener that terminates TLS (private CA) and speaks
    h2c to the database, for gqldb-cli and apps outside the host. Bound 0.0.0.0 like every :84xx door,
    so it answers on the LAN and on the tailnet IP (verified 2026-09-30 for :8450). The metamodel allows
    one tier per endpoint, so the wider one (tailnet) is recorded; LAN reach is a side effect of the bind,
    not a separate route. RBAC login is the only credential. The certificate must carry whatever name
    the client dials - the short name is already a SAN, the ts.net FQDN is not unless added via DEPLOY_CERT_EXTRA_SANS.

    '
  endpoint: grpcs://beeblebox:8451
  protocol: grpc
  auth: basic
- id: as_grafana
  name: Grafana
  description: Dashboards on the tailnet path router; authenticates callers itself.
  endpoint: https://beeblebox.taile98462.ts.net:8090/grafana/
  protocol: https
  auth: basic
- id: as_helloworld_lan
  name: Hello world raw port (LAN)
  description: 'The hello-world nginx published on all interfaces (ac-helloworld''s east-west exception;
    compose/windows-lan-extra-ports.txt lists it), so it answers raw on the LAN and the tailnet IP. Intended
    (owner decision 2026-10-09); holds no data.

    '
  endpoint: http://beeblebox:8080
  protocol: http
  auth: none
- id: as_homelab_arch_internal
  name: Homelab Architecture Manager (east-west)
  description: 'The app port for containers on this host (host.containers.internal:8104). The read API
    is unauthenticated here (gap-flat-east-west); agent routes need the agent token and approval routes
    the approver token, which only Caddy :8099 adds.

    '
  endpoint: http://127.0.0.1:8104
  protocol: http
  auth: none
- id: as_homelab_arch_mcp
  name: Homelab Architecture Manager (agents)
  description: 'MCP endpoint and /api/agent/* for AI agents, bearer AGENT_API_TOKEN. Caddy :8105 forwards
    nothing else (404) and strips the approver headers, so agents cannot approve.

    '
  endpoint: https://beeblebox.taile98462.ts.net:8105/mcp
  protocol: mcp
  auth: api-key
- id: as_homelab_arch_ui
  name: Homelab Architecture Manager (people)
  description: 'Browser app and API for the owner. Production runs HLA_HUMAN_AUTH=tailnet-trust (proof
    of concept, owner decision): Caddy :8099 adds the approver header with no password, so any tailnet
    device or local process can approve (accepted risk). HLA_HUMAN_AUTH=basic requires the owner''s password
    first (documented in compose/homelab-arch/README.md).

    '
  endpoint: https://beeblebox.taile98462.ts.net:8099/
  protocol: https
  auth: basic
- id: as_lan_consoles
  name: LAN service endpoints
  description: 'Direct per-service HTTPS ports on the home LAN, using a private CA. Includes the GQLDB
    console''s :8450 break-glass door; its designed route is the tailnet port in as-gqldb-manager.

    '
  endpoint: https://beeblebox:8443-8450, :9443
  protocol: https
  auth: network-identity
- id: as_litellm_api
  name: LiteLLM OpenAI-compatible API
  description: The gateway proper — /v1/chat/completions and the rest — authenticated by the master key
    or a virtual key, not by the console's login. Intended for east-west use by components on beeblebox
    (http://127.0.0.1:4000/litellm/v1); it answers more widely than that today, which gap-litellm-api-reach
    records. Any route that later needs internet exposure for an integration gets its own service entry
    and its own tier.
  endpoint: https://beeblebox.taile98462.ts.net:8090/litellm/v1
  protocol: https
  auth: api-key
- id: as_litellm_ui
  name: LiteLLM admin console
  description: Operator console for keys, models and spend — an administrative surface, not the gateway
    itself, which is why it delivers administration rather than the LLM gateway. Path-mounted on the tailnet
    router via SERVER_ROOT_PATH; the dedicated :8092 port is retained as a fallback until the mount has
    proven itself.
  endpoint: https://beeblebox.taile98462.ts.net:8090/litellm/ui/
  protocol: https
  auth: basic
- id: as_n8n_editor
  name: n8n editor and webhooks
  description: Workflow editor plus registered webhook and MCP trigger URLs, root-mounted on :443.
  endpoint: https://beeblebox.taile98462.ts.net/
  protocol: https
  auth: basic
- id: as_n8n_lan
  name: n8n raw port (LAN)
  description: 'n8n''s own HTTP port, published on all interfaces (ac-n8n''s east-west exception), so
    the editor also answers raw on the LAN and the tailnet IP beside the Funnel and the Caddy door. Intended
    (owner decision 2026-10-09): apps developed on the laptop use the production n8n. Recorded at the
    LAN tier, which is what the publish adds; basic auth still applies.

    '
  endpoint: http://beeblebox:5678
  protocol: http
  auth: basic
- id: as_ollama
  name: Ollama API
  description: 'Ollama''s native API, unauthenticated, bound 0.0.0.0 so it answers on the LAN and on the
    tailnet IP; the wider of the two (tailnet) is recorded. Its caller is litellm; gap-ollama-reach records
    that anyone on either network can also call it.

    '
  endpoint: http://beeblebox:11434
  protocol: http
  auth: none
- id: as_prometheus
  name: Prometheus UI and API
  description: Query UI and API on the tailnet path router. Also answers east-west on the host-internal
    port.
  endpoint: https://beeblebox.taile98462.ts.net:8090/prometheus/
  protocol: https
  auth: network-identity
- id: as_samba
  name: SMB file shares
  description: 'Password-only shares, no guest. Answers on the LAN as well as the tailnet.

    '
  endpoint: smb://beeblebox (:139, :445)
  protocol: smb
  auth: basic
- id: as_ssh
  name: SSH
  description: 'Operator shell and deploy transport. Answers on the LAN as well as the tailnet; tiered
    with the other every-interface host services (compare as-ollama).

    '
  endpoint: ssh://beeblebox:22
  protocol: ssh
  auth: ssh-key
- id: as_weather_gui
  name: Weather GUI
  description: Unauthenticated GUI, kept private precisely because it is unauthenticated.
  endpoint: https://beeblebox.taile98462.ts.net:8090/weather
  protocol: https
  auth: network-identity
- id: as_weather_mcp
  name: Weather MCP transport
  description: Publicly reachable MCP endpoint; only the authenticated transport paths are published.
  endpoint: https://beeblebox.taile98462.ts.net/weather
  protocol: mcp
  auth: oauth
- id: as_xrdp
  name: Remote desktop
  description: Desktop login with a host account. Answers on the LAN as well as the tailnet.
  endpoint: rdp://beeblebox:3389
  protocol: rdp
  auth: basic
DataEntity:
- id: de_architecture_proposals
  name: Architecture change proposals and audit log
  description: 'Proposed, approved and rejected changes to the homelab_arch graph with their undo log
    and an append-only audit trail of who decided what.

    '
  plain_language: 'The record of every suggested change to the map and who approved it. It cannot be rebuilt
    from anywhere else.

    '
  classification: internal
  recoverability: irreplaceable
- id: de_blog_content
  name: Blog content
  description: Posts, pages, taxonomy and comments — 63 posts, 3 pages, 29 attachments.
  plain_language: A decade of published writing. Public to read, but impossible to recreate if lost.
  classification: public
  recoverability: irreplaceable
- id: de_graph_data
  name: Graph datasets
  description: 'Nodes, edges, labels and indexes held in GQLDB graphs, plus the RBAC users in __system__.
    Built up interactively rather than loaded from a source of record.

    '
  plain_language: 'The graphs themselves. Built by hand over time, so there is nowhere to reload them
    from if they are lost.

    '
  classification: internal
  recoverability: irreplaceable
- id: de_llm_usage
  name: LLM keys and usage history
  description: Virtual API keys and accumulated spend/usage records.
  plain_language: AI provider keys and the record of what has been spent.
  classification: secret
  recoverability: irreplaceable
- id: de_manager_config
  name: Manager connections and users
  description: 'Saved database connections and console logins. Connection passwords are encrypted at rest
    with ENCRYPTION_KEY, the same arrangement as N8N_ENCRYPTION_KEY in de-workflow-definitions - without
    that key they cannot be read again, and the recovery is to delete and re-create the connection rather
    than to recover the secret.

    '
  plain_language: 'Which databases the console knows about and who may log in. Scrambled with a key kept
    in the secrets file; if that key is lost the saved logins are simply re-entered.

    '
  classification: secret
  recoverability: recoverable
- id: de_media_assets
  name: Media assets
  description: Uploaded images and generated derivatives under wp-content.
  plain_language: The images used in posts.
  classification: public
  recoverability: irreplaceable
- id: de_monitoring_metrics
  name: Monitoring time series
  description: Fifteen days of scraped metrics. Disposable by design; nothing is lost that matters if
    it is.
  classification: internal
  recoverability: recoverable
- id: de_monitoring_state
  name: Alerting and dashboard state
  description: Alertmanager silences and Grafana's own database. Configuration is in git; this is only
    runtime state.
  classification: internal
  recoverability: recoverable
- id: de_oauth_tokens
  name: Issued OAuth tokens
  description: Tokens issued by the weather MCP authorisation server; reissuable.
  plain_language: Access passes handed to AI tools; they can simply be reissued.
  classification: secret
  recoverability: recoverable
- id: de_platform_secrets
  name: Platform secrets
  description: '.env — N8N_ENCRYPTION_KEY, database passwords, provider API keys, the Cloudflare API token
    used by cloudflare/ — plus tunnel credentials and the private CA. Gitignored, so it exists nowhere
    else.

    '
  plain_language: 'The master key file. Losing it makes several of the backups permanently unreadable,
    which is why it matters more than anything else here.

    '
  classification: secret
  recoverability: irreplaceable
- id: de_workflow_definitions
  name: Workflow definitions and credentials
  description: n8n workflows plus credentials encrypted at rest with N8N_ENCRYPTION_KEY.
  plain_language: 'The automations themselves, and the saved logins they use. The logins are scrambled
    with a key that must be kept separately — without it they can never be read again.

    '
  classification: confidential
  recoverability: irreplaceable
DataStore:
- id: ds_alertmanager
  name: Alertmanager state
  description: Silences and the notification log; recreated empty if lost, at the cost of re-silencing.
  technology: Podman volume
  backup_method: none
- id: ds_gqldb
  name: GQLDB graph store
  description: 'BACKUP DATABASE has the server write its own verified archive while serving; the LSM directory
    is never file-copied. The archives are written to the gqldb-backups volume, collected by backup.sh
    into the staging directory, and are not themselves a backup.

    '
  technology: Ultipa GQLDB 6.2.131 (LSM)
  backup_method: logical-dump
- id: ds_grafana
  name: Grafana state
  description: 'Grafana''s own database (sessions, users, ad-hoc edits). Datasource and dashboards are
    provisioned from git, so only changes made in the UI are lost with it.

    '
  technology: Podman volume
  backup_method: none
- id: ds_homelab_arch_proposals
  name: homelab-arch proposals database
  description: 'Online SQLite backup made inside the container and integrity-checked (compose/homelab-arch/backup.sh),
    collected by backup.sh; the volume is never file-copied.

    '
  technology: SQLite on Podman volume homelab-arch_proposals-data
  backup_method: logical-dump
- id: ds_litellm_db
  name: LiteLLM database
  description: pg_dump of the LiteLLM database holding virtual keys and spend history.
  technology: PostgreSQL 16
  backup_method: logical-dump
- id: ds_manager
  name: GQLDB Manager store
  description: 'The console''s own embedded store. It has no dump command, so the container is stopped
    for the copy - a cold copy, not a copy of a running database directory.

    '
  technology: GQLDB embedded via NAPI (LSM), Podman volume
  backup_method: file-copy
- id: ds_n8n_data
  name: n8n instance data
  description: n8n's instance directory; safe to copy as files since state lives in Postgres.
  technology: Podman volume
  backup_method: file-copy
- id: ds_n8n_db
  name: n8n database
  description: pg_dump of the n8n database; credentials inside remain encrypted at rest.
  technology: PostgreSQL 15
  backup_method: logical-dump
- id: ds_oauth_store
  name: OAuth token store
  description: Small JSON store of issued tokens.
  technology: Podman volume
  backup_method: file-copy
- id: ds_prometheus_tsdb
  name: Prometheus TSDB
  description: Deliberately not backed up - metrics are disposable and rebuilt from the next scrape.
  technology: Podman volume
  backup_method: none
- id: ds_secrets
  name: Secrets and credentials
  description: Included in the encrypted snapshot; the reason encryption is load-bearing.
  technology: Host filesystem (.env, ~/.cloudflared, certs/)
  backup_method: file-copy
- id: ds_wordpress_db
  name: WordPress database
  description: mariadb-dump --single-transaction, so the blog keeps serving during backup.
  technology: MariaDB 11.8
  backup_method: logical-dump
- id: ds_wp_content
  name: WordPress site tree
  description: The whole /var/www/html including wp-config.php, not merely uploads.
  technology: Podman volume
  backup_method: file-copy
