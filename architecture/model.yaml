Principle:
- id: p_ai_cost_to_value
  name: AI spend is tied to value
  description: Spend on AI computation is attributable to the value it produces and bounded by a budget
    set in advance.
  plain_language: 'Every pound or dollar spent on AI should be traceable to something worth having, and
    no one project or key can spend without a limit agreed beforehand.

    '
  statement: 'Spend on AI computation can be attributed to the value it produces, and is bounded by an
    explicit budget set before it is incurred.

    '
  rationale: 'AI computation is metered per call and cheap per call, so its total is easy to lose track
    of and hard to judge afterwards. A cost nobody can link to an outcome can be neither defended nor
    cut intelligently, and unbounded metering turns a leaked key or a runaway loop into an open-ended
    bill. Tokens are the unit actually consumed and outlast price and provider changes better than currency
    does, so budgets are preferred in tokens.

    '
  implication: 'AI calls carry an identity (key, team, purpose) so spend can be grouped by what it was
    for; spend that cannot be attributed to a purpose is a defect to fix, not an overhead to absorb; every
    identity has a budget, in tokens where the platform can enforce one and in currency otherwise. That
    makes the gateway the natural enforcement point, since it sees every call that passes through it.
    Today only per-key spend is recorded, and no budget is set (gap-no-spend-budget).

    '
- id: p_no_inbound
  name: No inbound ports
  description: The estate is reachable from the internet only via outbound-initiated connections.
  plain_language: 'Nothing on the internet can dial into the house. The house dials out, and traffic comes
    back down that same connection.

    '
  statement: The home network exposes no inbound listening ports to the internet.
  rationale: 'A residential network has no security team. Every open port is permanent attack surface
    protecting everything else on the LAN, not just the service behind it.

    '
  implication: 'Public reachability must be achieved by outbound-only connections. Port-forwarding is
    rejected outright, even where it would be simpler.

    '
- id: p_open_east_west
  name: East-west traffic is open
  description: Containers reach each other's published endpoints without per-pair configuration.
  plain_language: 'Applications on this server can talk to each other freely, without extra setup for
    each new pair. Nothing outside the server gains anything by it.

    '
  statement: 'Any container on the host may address any endpoint another container has published; no shared
    network or per-pair grant is required.

    '
  rationale: 'Per-pair network wiring makes every new internal dependency a change to the provider''s
    deployment — friction paid on every integration, to defend a boundary between workloads that are already
    deployed and operated together.

    '
  implication: 'Applications publish on a host-internal address that containers can reach and the LAN
    and tailnet cannot. Publishing is what makes an endpoint internally reachable, so a port left unpublished
    — a database, say — stays private by default. Internal endpoints must not treat network position as
    authentication. The bias is toward this pattern, but it is not absolute: for development convenience
    a component may publish on 0.0.0.0 instead, which also reaches the LAN and tailnet. That is an intentional
    decision taken per network-accessible component and recorded on the component itself (n8n, hello-world
    and Ollama today), not a gap, and a component with no such record is expected to follow the principle.

    '
- id: p_reproducible
  name: Reproducible from source
  description: Configuration is version-controlled; only secrets live outside git.
  plain_language: 'The entire setup is written down as code, so it can be rebuilt from scratch rather
    than remembered.

    '
  statement: The estate is rebuildable from a git repository plus a secrets file.
  rationale: 'Configuration discovered only by inspecting a running host is lost when that host is.

    '
  implication: 'Manual changes on the server are defects. Every stack, proxy rule and unit file is committed;
    only secrets live outside version control.

    '
- id: p_rootless
  name: Rootless by default
  description: Workloads hold no host privilege.
  plain_language: 'Applications run with the minimum permissions they need, so a compromise of one does
    not hand over the whole machine.

    '
  statement: Workloads run as an unprivileged user; root is used only for host setup.
  rationale: A container escape should not yield host root.
  implication: 'Low ports cannot be bound directly, which forces reverse-proxy patterns; the constraint
    is accepted rather than worked around.

    '
- id: p_tested_recovery
  name: Recovery is tested, not assumed
  description: Restorability is demonstrated, not inferred from job success.
  plain_language: 'We regularly prove the backups actually work by restoring from them, rather than trusting
    that they do.

    '
  statement: Backups are verified by performing a restore, not by observing that a job succeeded.
  rationale: 'A backup job reporting success proves a file was written. It says nothing about whether
    the contents can be restored.

    '
  implication: 'Dumps are checked for completion markers, and restores are exercised against a throwaway
    database and compared to production.

    '
- id: p_tiered_exposure
  name: Exposure is tiered by sensitivity
  description: Reachability from beyond the host is an explicit, recorded property of every endpoint.
  plain_language: 'Each thing is visible to the smallest possible audience outside the server — the whole
    internet, only my own devices, or only the house — and going wider is an explicit choice.

    '
  statement: 'Every endpoint is assigned the narrowest reachability tier beyond the host that still serves
    its purpose.

    '
  rationale: 'Most services need to be reachable by one person, not by the internet. Defaulting to public
    and then bolting on authentication inverts the safer order.

    '
  implication: 'New services start private. Publishing one beyond the host is a deliberate, recorded decision,
    and admin interfaces are never published without an identity check in front of them. This principle
    governs reachability from outside beeblebox; traffic between workloads already running on it is governed
    by p-open-east-west.

    '
Pillar:
- id: pl_agility
  name: Agility
  description: The cost and speed of change, including the friction of integrating something new.
  plain_language: How easily something new can be added or an existing thing changed.
  characteristics: 'Cost and speed of change, integration friction, and the effort of onboarding another
    service or use case.

    '
  boundary_test: Does it make change cheaper or faster, or add friction to it?
- id: pl_control
  name: Control and sovereignty
  description: Authority over the estate's assets, dependencies and behaviour, including compliance.
  plain_language: Owning the things that matter - the address, the data, the way it behaves - rather than
    renting them from someone who can change terms.
  characteristics: 'Data custody, residency, retention and portability; lock-in and the ability to substitute
    a provider; deterministic, auditable behaviour; and compliance with obligations imposed from outside.
    No compliance obligation is currently modelled.

    '
  boundary_test: 'Would it still matter if no attacker existed? Is it about who holds authority over an
    asset, a dependency or a behaviour?

    '
- id: pl_cost
  name: Cost
  description: Recurring spend and the resources the estate consumes.
  plain_language: What it costs to keep this running, and how little that can be.
  characteristics: 'Recurring spend, metering, reliance on free tiers, and the hardware and capacity consumed;
    for AI computation, attributing spend to the value it produces and bounding it with budgets.

    '
  boundary_test: Is it about money, or about a resource being consumed?
- id: pl_quality
  name: AI output quality
  description: Whether the output of model-backed components stays good over time.
  plain_language: Whether the answers the AI parts give are still good, and how we would know if they
    were not.
  characteristics: 'Correctness and usefulness of model output, drift and regression, evaluation at build
    time and at runtime, and the effect of a model version changing underneath the estate. It does not
    cover the reliability of the platform itself, which is Resilience.

    '
  boundary_test: Does it concern whether what a model produces stays good?
- id: pl_resilience
  name: Resilience
  description: Surviving and recovering from failure, running the estate day to day, and the headroom
    to grow.
  plain_language: Staying up, getting back up when it falls, and being able to grow if it ever had to.
  characteristics: 'Backup, restore, rebuild and restart; operability (observing, deploying and repairing);
    and scale - the architectural headroom to serve many users, use cases and locations. Scale is a design
    property, not a deployed one: the estate is one node in one house and is not expected to realise it
    (gap-single-node).

    '
  boundary_test: 'Does it bound the loss or downtime from a fault, make a fault visible and repairable,
    or decide how far the design could grow?

    '
- id: pl_security
  name: Information security
  description: Preventing unauthorised access to, or action on, the estate and the data in it.
  plain_language: Keeping the wrong people and programs out, and what they would find if they got in.
  characteristics: 'Reachability, identity, isolation, hardening and credential hygiene, and the protection
    of data against an adversary (encryption, secret handling). It excludes data governance, which is
    Control and sovereignty.

    '
  boundary_test: 'Does it matter only because of an adversary? If it would still matter with none - custody,
    residency, retention - it belongs to pl-control.

    '
