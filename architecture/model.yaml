ExposureTier:
- id: et_lan
  name: Home LAN only
  description: Break-glass access path; not the designed route for any service.
  plain_language: Only reachable from inside the house.
  reachable_from: Devices on the home network
  enforced_by: Caddy listeners bound to the LAN with a private CA
- id: et_loopback
  name: Host internal only
  description: 'Where every application actually listens. Reaching it requires already being on beeblebox
    — as the host, or as a workload it is running.

    '
  plain_language: 'Not reachable from outside the server — only from the server and the applications it
    runs.

    '
  reachable_from: beeblebox itself, and any container running on it
  enforced_by: Bind to a host-internal address that is neither LAN- nor tailnet-routable
- id: et_public_cloudflare
  name: Public via Cloudflare
  description: Custom-domain public tier. The only tier serving thelearningcto.com.
  plain_language: Anyone in the world can reach this.
  reachable_from: The entire internet
  enforced_by: Cloudflare edge; admin paths additionally gated by Access
- id: et_public_funnel
  name: Public via Tailscale Funnel
  description: 'Public tier for machine callers. Cannot serve a custom domain, which is precisely why
    the blog needed Cloudflare instead.

    '
  plain_language: Also reachable by anyone, but on a technical address rather than a friendly one.
  reachable_from: The entire internet
  enforced_by: Tailscale Funnel on the *.ts.net hostname
- id: et_tailnet
  name: Tailnet only
  description: Default tier for anything with an admin surface or unauthenticated routes.
  plain_language: Only my own enrolled devices can reach this, from anywhere in the world.
  reachable_from: Devices enrolled in the tailnet
  enforced_by: Tailscale device identity
Control:
- id: ctl_access_gate
  name: Cloudflare Access on admin paths
  description: 'Email OTP challenge at the edge for /wp-admin and /wp-login.php, so brute-force traffic
    never reaches PHP. Two Access apps (one per path), each carrying only the admin-email policy, managed
    in cloudflare/main.tf. Until 2026-10-05 both also carried an "Everyone" allow policy, which admits
    anyone who completes an IdP login (including One-time PIN with any inbox), so the gate was open; allow
    policies are OR''d, so the Terraform deliberately attaches no other policy.

    '
  type: preventive
- id: ctl_dump_verification
  name: Dump completion verification
  description: 'Each dump is checked for its terminator, because a dump truncated midway still produces
    a valid compressed file.

    '
  type: detective
- id: ctl_edge_waf
  name: Cloudflare WAF and HTTPS enforcement
  description: 'A custom WAF rule issues a managed challenge for requests to stray .php files (wp-login.php,
    wp-cron.php, xmlrpc.php and /wp-admin/ excepted; the live action is managed_challenge, not block -
    see waf_php_action in cloudflare/terraform.tfvars), a skip rule lets the blackbox uptime probe''s
    GET / past it, and always-use-https is on - the only place http to https happens, because Caddy :8097
    hardcodes X-Forwarded-Proto https. All in cloudflare/main.tf.

    '
  type: preventive
- id: ctl_encrypted_backup
  name: Client-side backup encryption
  description: 'restic encrypts before upload, so the storage provider — and anyone holding only the storage
    key — cannot read the secrets in the snapshot.

    '
  type: preventive
- id: ctl_offsite_copy
  name: Weekly off-site copy
  description: Weekly snapshot to Azure Blob, 12-week retention, surviving loss of the house.
  type: recovery
- id: ctl_published_surface
  name: Minimum published surface
  description: 'Public fronts publish only what must be public — an allowlist for the MCP transport, and
    xmlrpc.php blocked outright.

    '
  type: preventive
- id: ctl_restore_rehearsal
  name: Restore rehearsal
  description: 'Restores are loaded into a throwaway database and compared row-for-row with production.

    '
  type: detective
- id: ctl_rootless
  name: Rootless containers
  description: Workloads run as uid 1000; a container escape does not yield host root.
  type: preventive
- id: ctl_tailnet_identity
  name: Tailnet device identity
  description: Reachability requires an enrolled device, making network position the first auth factor.
  type: preventive
Gap:
- id: gap_ai_evals_not_adopted
  name: Estate components are not traced or evaluated
  description: 'LangSmith is deployed (ep-langsmith) and Python applications outside the estate already
    send traces to it, but nothing running on beeblebox does, and the LiteLLM gateway has no LangSmith
    callback configured. So no estate component has its output traced or evaluated at build time or runtime,
    and a provider changing a model, or an Ollama model replaced by hand, would go unnoticed. LiteLLM''s
    documented callback (`callbacks: ["langsmith"]`, LANGSMITH_API_KEY, optional LANGSMITH_BASE_URL) is
    the lowest-effort route, covering every caller through the gateway; see ep-langsmith for the networking
    and data-custody implications. Runtime evaluation would build on the observability stack that already
    serves Resilience. The tool for checking the AI parts'' answers exists and is in use elsewhere, but
    none of the estate''s own AI components use it yet.

    '
  severity: low
  status: accepted
- id: gap_deploy_from_workstation
  name: Production deploys from a workstation working tree
  description: Deploy syncs a directory, not a reviewed ref; no record of the deployed commit and no check
    that the tree matches origin. Tracked as IMPROVEMENTS 1.5.
  severity: medium
  status: planned
- id: gap_edge_state_local
  name: Cloudflare edge state is local and applied by hand
  description: 'cloudflare/terraform.tfstate is a gitignored local file on the laptop and is not in the
    backup; if lost, the edge must be re-imported. Applies are manual (deploy only plans and warns on
    drift). The IP Access Rule allowing the probe''s egress IP goes stale when the residential address
    changes, and the zone''s single custom-rules ruleset is owned wholesale by Terraform, so any rule
    added in the dashboard is removed by the next apply.

    '
  severity: low
  status: accepted
- id: gap_flat_east_west
  name: No isolation between co-located workloads
  description: 'Any container can reach any endpoint another container publishes, so a compromise of one
    workload reaches the internal surface of all of them. Most published endpoints authenticate their
    callers — litellm on virtual keys, n8n on basic auth — but weather-mcp''s bearer check wraps only
    its /mcp mount, leaving its GUI and /api/* routes unauthenticated and now reachable from every other
    container.

    '
  plain_language: 'If one application on the server were broken into, it could talk to the others. Accepted
    in exchange for not having to wire up every connection by hand.

    '
  severity: medium
  status: accepted
- id: gap_litellm_api_reach
  name: LLM gateway API reachable beyond its intended scope
  description: 'The API is intended to be east-west only, called by components running on beeblebox. Caddy
    proxies the whole app, so /v1 also answers on the LAN (:8447) and on the tailnet (:8090/litellm and
    :8092) alongside the console. Every route is key-authenticated, so this widens who may present a key
    rather than removing the check. Narrowing it means an allowlist on those sites — the pattern the :8095
    site already uses for weather-mcp. The one exception is /litellm/metrics, which is unauthenticated
    east-west for Prometheus and is answered 404 by Caddy on :8447, :8092 and :8090.

    '
  plain_language: 'The AI gateway can be called from more places than intended, though a key is still
    needed to use it.

    '
  severity: low
  status: accepted
- id: gap_moving_image_tags
  name: Several images track moving tags
  description: nginx:alpine (hello-world, and the base image claude-mock-test builds FROM) and caddy:alpine
    are pulled and swapped on every deploy, so upstream changes reach production without review. Pinned
    images, including litellm (pinned to release tag v1.105.1), are tracked by check-updates.py; these
    are not.
  severity: medium
  status: planned
- id: gap_n8n_env_readable
  name: n8n Code nodes can read all environment variables
  description: N8N_BLOCK_ENV_ACCESS_IN_NODE is false, so workflow code can read N8N_ENCRYPTION_KEY and
    every other value passed to the container.
  severity: high
  status: planned
- id: gap_no_alerting
  name: Alerting limited to probes, host resources, unit failures and certificates
  description: 'Prometheus probes every stack and public URL, watches host disk, memory and CPU, failed
    systemd user units and the Caddy certificate, and Alertmanager posts failures to Slack #myagentchannel.
    Still uncovered: backup age (the backup scripts emit no metric), application-level errors in apps
    that expose no metrics, and a host-wide outage - the alert pipeline runs on the host it watches (gap-single-node),
    so nothing reports that the whole box is down. n8n and GQLDB are probe-only by decision: n8n''s /metrics
    would be public on the Funnel, and GQLDB''s metrics listener exposes unauthenticated /debug/pprof.

    '
  plain_language: 'Something now tells me when a service, a website or the disk is in trouble. It cannot
    tell me if the whole server is off, and it does not yet watch the backups.

    '
  severity: low
  status: mitigated
- id: gap_no_container_hardening_baseline
  name: No container hardening baseline
  description: Only homelab-arch runs read-only with no-new-privileges. Other stacks keep default capabilities,
    writable root filesystems and no pids limit; only gqldb sets a memory limit. The add-service template
    does not apply a baseline and the validator does not check one.
  severity: medium
  status: planned
- id: gap_no_secret_rotation
  name: No secret rotation
  description: 'Long-lived provider keys and a storage account key sit in .env with no rotation schedule.
    A SAS token scoped to the backup container is the identified improvement. homelab-arch adds two more
    (HLA_APPROVER_TOKEN, AGENT_API_TOKEN, also in .env), and podman-compose passes them to `podman create`
    as `-e NAME=value` arguments, so they are briefly visible in the host process list and in `podman
    inspect` to local users of the server (no env_file or secret store is available in this podman-compose
    version). Local accounts are treated as inside the trust boundary; rotate the tokens if that stops
    being true.

    '
  severity: medium
  status: accepted
- id: gap_no_spend_budget
  name: AI spend is neither budgeted nor tied to value
  description: 'Model-provider usage is the only metered cost and nothing bounds it: LiteLLM records spend
    per virtual key (de-llm-usage), but no limit is set, so a leaked or runaway key spends until someone
    notices, and the model records spend per key rather than the value that spend produced (p-ai-cost-to-value).
    The control is defined but not implemented. Intended shape, per LiteLLM''s documented budgets: a global
    `litellm_settings.max_budget` and `budget_duration`, plus a `max_budget` and `budget_duration` on
    every virtual key, so requests fail once a cap is crossed (enforced against spend in the existing
    Postgres, ds-litellm-db); `team_id`, `key_alias` and `metadata` on keys to attribute spend to a purpose;
    provider-side caps as a backstop; and an alert when spend nears a cap. The principle prefers token
    budgets, but as I read LiteLLM''s documentation it enforces only a currency cap (`max_budget`) and
    per-minute rate limits (`tpm_limit`, `rpm_limit`), not a cumulative token cap - a token budget would
    need enforcing elsewhere, or a currency cap used as the nearest proxy. Amounts are the operator''s
    to set. When implemented it will be a Control implementing p-ai-cost-to-value. Nothing stops the AI
    bill from running away if a key leaks, and nobody can yet say what value a given key''s spending bought.
    A monthly cap is designed but not switched on.

    '
  severity: medium
  status: planned
- id: gap_no_staging
  name: No staging environment
  description: Changes are validated by deploying to production and verifying afterwards.
  severity: low
  status: accepted
- id: gap_ollama_reach
  name: Ollama API unauthenticated and reachable beyond litellm
  description: 'Ollama has no authentication and is bound 0.0.0.0 so litellm''s container can reach it,
    so any device on the LAN or tailnet can run inference or pull and delete models. Accepted as part
    of the per-component east-west decision on ac-ollama; narrowing it means binding to the host-internal
    address, which litellm can reach through pasta''s host-loopback mapping.

    '
  plain_language: 'Anyone on my home network or my own devices can use the local AI model directly, without
    going through the gateway or a key.

    '
  severity: low
  status: accepted
- id: gap_public_demo_surface
  name: Demonstration apps published
  description: 'claude-mock-test is served on the public Funnel. Accepted because it holds no data and
    makes no outbound calls, and because it is kept deliberately as a showcase — but it is still published
    surface that no non-functional requirement calls for.

    '
  severity: low
  status: accepted
- id: gap_residential_connectivity
  name: Residential connectivity
  description: Availability is bounded by a domestic ISP and household power.
  severity: medium
  status: accepted
- id: gap_single_node
  name: Single point of failure
  description: 'Every production workload runs on one machine in one house. Backups make the data survivable;
    the service does not. Recovery is measured in hours of rebuild.

    '
  plain_language: 'Everything runs on one computer at home. If it fails, the services are down until it
    is rebuilt — though nothing is permanently lost.

    '
  severity: high
  status: accepted
- id: gap_smb_home_share
  name: Samba shares the operator's home directory read-write
  description: 'The DaraDoom share mapped /home/daradoom read-write, with force user daradoom, on every
    interface and with no hosts allow, so it answers on the LAN and tailnet. There is no guest access
    (map to guest = Never, anonymous tree connects were refused), but the one account''s password therefore
    gave read-write access to .env (the master keys) and ~/.ssh, including authorized_keys, which turns
    SMB access into a shell as the account that owns every stack. Mitigated 2026-10-06: the share is removed
    (the laptop only mounts Models), restrict anonymous = 2 is set, and the include in smb.conf now sits
    below the global parameters, so workgroup, disable netbios, socket options and multichannel take effect.
    Residual: the remaining shares are still read-write for the same single account on the LAN and tailnet.

    '
  plain_language: 'One password used to open my whole home folder from anywhere on the home network, including
    the file of master keys. That folder is no longer shared.

    '
  severity: medium
  status: mitigated
Risk:
- id: rk_backup_silent_failure
  name: Backups can fail or be unreadable without anyone noticing
  description: The weekly backup once failed silently for three weeks. A failed-unit alert now exists,
    but there is no backup-age metric, so a disabled timer or a stuck run goes unseen, and the restic
    passphrase must also be recoverable off-host. Restore rehearsal currently covers blog content only,
    not n8n credentials, litellm, GQLDB or homelab-arch proposals.
  category: operational
  severity: high
  likelihood: medium
  status: open
  mitigation: 1) backup.sh writes a last-success timestamp through the node-exporter textfile collector;
    alert when older than 9 days. 2) Confirm RESTIC_PASSWORD and a copy of .env are in the password manager.
    3) Extend restore rehearsal to n8n (decrypt one credential), litellm and homelab-arch; run quarterly
    and alert when the last rehearsal is older than 100 days. 4) Daily backup for n8n and homelab-arch
    to shorten RPO.
- id: rk_n8n_public_compromise
  name: n8n compromise exposes secrets and downstream services
  description: n8n is the only service published publicly (Funnel :443) and also answers on the LAN and
    tailnet at :5678 with a single shared basic-auth credential. N8N_BLOCK_ENV_ACCESS_IN_NODE=false lets
    any Code node read every env var, including N8N_ENCRYPTION_KEY, so a webhook or workflow compromise
    reaches the key plus everything n8n can call (LiteLLM, Ollama, Slack).
  category: security
  severity: high
  likelihood: medium
  status: open
  mitigation: 1) Set N8N_BLOCK_ENV_ACCESS_IN_NODE=true or move needed values into n8n credentials. 2)
    Restrict Funnel to /webhook/* and the MCP path; keep the editor tailnet-only. 3) Replace basic auth
    with n8n user management (owner account, 2FA). 4) read_only, cap_drop ALL and no-new-privileges on
    the n8n container. 5) Per-key budgets and scopes on the LiteLLM key n8n holds.
- id: rk_no_security_event_visibility
  name: Security events are not observed
  description: Alert rules cover availability, host resources, unit failures and certificate expiry. Nothing
    watches authentication failures on n8n or LiteLLM, error spikes on the public doors, hits on admin
    paths, or listening ports that differ from the model, so an intrusion or misconfiguration would show
    up only as an availability symptom, if at all.
  category: security
  severity: medium
  likelihood: medium
  status: open
  mitigation: Caddy access-log metrics or Loki with alerts on 4xx/5xx spikes on Funnel and tunnel doors,
    n8n and LiteLLM auth failures and admin-path hits; weekly diff of ss -tlnp against model.yaml; external
    heartbeat for the Watchdog alert so a dead Prometheus or Alertmanager is noticed.
- id: rk_secret_concentration
  name: One leak exposes every secret
  description: All secrets live in one gitignored .env whose only copy is the backup. POSTGRES_PASSWORD
    is shared by two Postgres instances, the restic repository credential sits on the host it protects,
    and restored files contain plaintext secrets. Restic client-side encryption is the only barrier if
    the storage key leaks.
  category: security
  severity: high
  likelihood: low
  status: open
  mitigation: 'Per-database passwords and per-stack env files (or podman secrets) to shrink blast radius
    and allow per-service rotation; SAS token scoped to the backup container instead of the storage account
    key; restore directories removed after use. Related gap: gap_no_secret_rotation.'
- id: rk_unreviewed_image_updates
  name: Moving image tags reach production unreviewed
  description: nginx and caddy track moving tags (alpine) and are pulled and swapped on every deploy.
    LiteLLM, which holds every LLM provider credential, is pinned to a release tag (v1.105.1) so upgrades
    are deliberate, but the tag is not a digest and the image is not vulnerability-scanned. The GQLDB
    package is a vendor .deb with no public upstream to scan or verify beyond a recorded sha256.
  category: dependency
  severity: high
  likelihood: low
  status: open
  mitigation: Pin caddy and nginx by digest (or minor version) and litellm by digest, accepting updates
    deliberately; run an image vulnerability scan (for example Trivy) over the pinned set from check-updates.py
    or a weekly timer; keep the sha256 check on the vendor package.
- id: rk_unreviewed_prod_deploy
  name: Production runs whatever is in one laptop's working tree
  description: deploy-to-server.sh prod rsyncs the workstation working directory. Uncommitted edits deploy
    silently, there is no record of which commit is running, and the laptop is a single point of failure
    for changes. Model validation gates what can be committed and deployed but cannot assert the deployed
    tree matches origin.
  category: governance
  severity: medium
  likelihood: high
  status: open
  mitigation: 'Interim: deploy-to-server.sh prod refuses a dirty tree or a commit not on origin/main,
    and writes a DEPLOYED_REF file to the host exported as a Prometheus metric so drift is visible. Target:
    deploy a ref, not a directory (pull-based agent or self-hosted runner), with its own secret delivery.'
- id: rk_wp_edge_regression
  name: WordPress edge protections regress or are bypassed
  description: The admin Access gate was open to Everyone until 2026-10-05. The uptime-probe WAF skip
    rule matches a spoofable user agent, wp-cron.php is excepted from the WAF .php rule, and Terraform
    state is local and applied by hand, so edge drift is only warned about at deploy time. xmlrpc.php
    is already blocked outright at Caddy (ctl_published_surface).
  category: security
  severity: medium
  likelihood: medium
  status: open
  mitigation: Cloudflare rate limiting on /wp-login.php; scheduled terraform plan that alerts on non-empty
    drift; remote encrypted Terraform state; replace the user-agent probe skip with an Access service
    token or secret header; a periodic check that the Access apps carry only the admin-email policy.
UseCase:
- id: uc_shakespeare_play_explorer
  name: Shakespeare Play Explorer
  description: Answers questions about a Shakespeare play submitted through a form, using the local model.
  problem_statement: 'Answer questions about a Shakespeare play submitted through a form: the local model
    returns JSON, and the answer is emailed only if the recipient is allowlisted.'
  status: live
