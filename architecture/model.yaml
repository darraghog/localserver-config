  type: string
Node:
- id: n_beeblebox
  name: beeblebox
  description: 'Sole server. Runs every application component, including the host services SSH, Samba
    and xrdp (ac-sshd, ac-samba, ac-xrdp). Also runs CUPS (loopback :631), which is neither critical nor
    reachable from outside the host and so is not modelled.

    '
  location: home
  spec: Ubuntu 26.04, 12 cores, 30 GB RAM, 1.1 TB NVMe
- id: n_laptop
  name: darragh-laptop
  description: Development and deployment workstation; runs no production workload.
  location: home
  spec: Windows + WSL2, Podman
- id: n_mobile
  name: Mobile devices
  description: Tailnet members providing operator access away from home.
  location: mobile
  spec: iOS
TechnologyService:
- id: ts_caddy
  name: Reverse proxy and TLS termination
  description: 'Single ingress point; every tier''s routing rules are expressed here. Also serves its
    own /metrics on host-internal :8103, and Prometheus, Alertmanager and Grafana expose theirs on :8101
    and :8102, none reachable from the LAN or tailnet.

    '
  product: Caddy (host network)
- id: ts_cloudflared
  name: Outbound tunnel connector
  description: Dials out to Cloudflare so the blog is public with no inbound port.
  product: cloudflared
- id: ts_podman
  name: Container runtime
  description: Runs every application component as an unprivileged user.
  product: Podman 5.7.0 (rootless) + podman-compose
- id: ts_restic
  name: Backup engine
  description: Client-side encrypted, deduplicating, weekly with 12-week retention.
  product: restic 0.19.1 (containerised)
- id: ts_systemd
  name: Service lifecycle and scheduling
  description: 'Starts stacks at boot without login, drives the weekly backup timer, and runs the unit-metrics
    timer whose textfile metric feeds the SystemdUserUnitFailed alerts.

    '
  product: systemd user units with loginctl linger
- id: ts_tailscale
  name: Mesh VPN and public funnel
  description: Provides private device-identity reachability and the public *.ts.net ingress.
  product: Tailscale
Network:
- id: net_container
  name: Container network
  description: 'The podman bridge networks and the host-internal address they reach. Membership is being
    a workload on beeblebox; there is no boundary between members.

    '
  trust: trusted
- id: net_home_lan
  name: Home LAN
  description: 192.168.86.0/24 behind Google Wi-Fi and a bridged Verizon FIOS router.
  trust: trusted
- id: net_internet
  name: Public internet
  description: Anonymous callers; the zone the public tiers are addressable from.
  trust: untrusted
- id: net_tailnet
  name: Tailnet
  description: WireGuard mesh; membership is identity, so reachability implies authentication.
  trust: authenticated
ExternalProvider:
- id: ep_amazon_registrar
  name: Amazon Registrar
  description: Registrar of record; delegates DNS to Cloudflare nameservers.
  function: Domain registration for thelearningcto.com
  cost: ~annual domain fee
  lock_in: low
- id: ep_azure_blob
  name: Azure Blob Storage
  description: restic abstracts the backend; substituting for S3 is a configuration change.
  function: Off-site encrypted backup repository
  cost: pennies/month (Cool tier)
  lock_in: low
- id: ep_cloudflare
  name: Cloudflare
  description: 'Holds the domain''s DNS and fronts the blog. Substitutable, but doing so means re-establishing
    DNS, tunnel and the admin identity gate together.

    '
  function: Authoritative DNS, tunnel ingress, edge TLS, Access identity gating
  cost: free tier
  lock_in: medium
- id: ep_github
  name: GitHub
  description: Remote of the localserver-config repository that defines the estate.
  function: Configuration source of truth
  cost: free tier
  lock_in: low
- id: ep_improvmx
  name: ImprovMX
  description: Forwards mail addressed to the domain; depends on MX records surviving DNS changes.
  function: Inbound email forwarding for the domain
  cost: free tier
  lock_in: low
- id: ep_langsmith
  name: LangSmith
  description: 'Operator''s account, in use today by Python applications running outside the estate (the
    development workstation), which send traces to it. No component deployed on beeblebox uses it yet
    (gap-ai-evals-not-adopted). Reaching it from a container is outbound HTTPS only, so p-no-inbound is
    unaffected, and it is the same path litellm already uses to reach the model providers; the repo records
    no egress filtering. What it does change: prompts and outputs leave the estate for a third party,
    so what a workflow or app sends is a data-custody decision (pl-control), and each tracing client needs
    its own API key in .env. LiteLLM has a LangSmith callback, which would make the gateway the single
    egress point and the single key for every caller using it.

    '
  function: Trace capture and automated evaluation (build time and runtime) for LLM applications
  cost: per account plan; tier not recorded
  lock_in: low
- id: ep_model_providers
  name: Model providers
  description: 'Upstream model APIs; the only metered cost in the estate. Reached only through LiteLLM,
    across three providers, which is what keeps substitution cheap and lock-in low.

    '
  function: OpenAI, Anthropic and Google inference APIs consumed via LiteLLM
  cost: metered usage
  lock_in: low
- id: ep_slack
  name: Slack
  description: 'Outbound-only HTTPS from Alertmanager. Substitutable by any notifier Alertmanager supports;
    the bot token is the one secret involved.

    '
  function: Alert delivery to
  cost: free tier
  lock_in: low
- id: ep_tailscale
  name: Tailscale
  description: Carries both the private tier and the machine-facing public tier.
  function: Mesh VPN, private service reachability, public Funnel ingress
  cost: free tier
  lock_in: medium
Artifact:
- id: art_ps_check_ports
  name: Port checks
  description: Asserts expected TCP listeners; core-only is 8080 and 5678
  kind: pipeline_stage
  location: localserver-config
- id: art_ps_check_tls
  name: TLS diagnostic
  description: Runs for prod only, when certs/server.pem exists on the target
  kind: pipeline_stage
  location: localserver-config
- id: art_ps_ci_github
  name: GitHub Actions CI
  description: Runs generate, harness, JSON syntax and secret scan on push and pull request
  kind: pipeline_stage
  location: n8n-workflow
- id: art_ps_eval_cases
  name: Validate eval cases
  description: Parse check on the eval corpus
  kind: pipeline_stage
  location: n8n-workflow
- id: art_ps_evals
  name: Eval run
  description: Runs the eval corpus against the token-authenticated webhook
  kind: pipeline_stage
  location: n8n-workflow
- id: art_ps_generate
  name: Generate workflows
  description: Regenerates core, form and eval workflow JSON from a single generator
  kind: pipeline_stage
  location: n8n-workflow
- id: art_ps_harness
  name: Workflow harness
  description: Structural and dataflow assertions over the workflow JSON
  kind: pipeline_stage
  location: n8n-workflow
- id: art_ps_import_activate
  name: Import and activate
  description: Imports workflow JSON via the n8n REST API and activates it
  kind: pipeline_stage
  location: n8n-workflow
- id: art_ps_infra_deploy
  name: Infra deploy
  description: Syncs the host repo, regenerates TLS and brings up the compose stacks
  kind: pipeline_stage
  location: localserver-config
- id: art_ps_json_syntax
  name: Workflow JSON syntax
  description: Parse check on every workflow export
  kind: pipeline_stage
  location: n8n-workflow
- id: art_ps_package
  name: Package release
  description: Builds the release bundle and manifest with a release id
  kind: pipeline_stage
  location: n8n-workflow
- id: art_ps_rollback
  name: Rollback
  description: Re-imports and reactivates a prior known-good release
  kind: pipeline_stage
  location: n8n-workflow
- id: art_ps_rsync_bundle
  name: Sync release bundle
  description: Places the packaged release on the target host
  kind: pipeline_stage
  location: n8n-workflow
- id: art_ps_secret_scan
  name: Secret scan
  description: Rejects secrets committed in workflow JSON or repo files
  kind: pipeline_stage
  location: n8n-workflow
- id: art_ps_smoke_health
  name: Service smoke
  description: Checks the n8n /healthz endpoint on the target
  kind: pipeline_stage
  location: n8n-workflow
- id: art_ps_webhook_smoke
  name: Webhook smoke
  description: Warn-only in dev; required in test and prod
  kind: pipeline_stage
  location: n8n-workflow
- id: art_repo_knowledgebase
