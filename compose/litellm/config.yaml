general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true   # ignore unsupported params instead of erroring
  num_retries: 2

model_list:
  # --- fast / default ---
  - model_name: gemma4:e4b
    litellm_params:
      model: ollama_chat/gemma4:e4b
      api_base: http://host.docker.internal:11434

  - model_name: qwen2.5-coder:3b
    litellm_params:
      model: ollama_chat/qwen2.5-coder:3b
      api_base: http://host.docker.internal:11434

  # --- general chat ---
  - model_name: qwen3.5:latest
    litellm_params:
      model: ollama_chat/qwen3.5:latest
      api_base: http://host.docker.internal:11434

  - model_name: Qwen3.5-9B-Q4_K_M:latest
    litellm_params:
      model: ollama_chat/Qwen3.5-9B-Q4_K_M:latest
      api_base: http://host.docker.internal:11434

  - model_name: qwen3:14b
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://host.docker.internal:11434

  - model_name: llama3.2:latest
    litellm_params:
      model: ollama_chat/llama3.2:latest
      api_base: http://host.docker.internal:11434

  - model_name: llama3:latest
    litellm_params:
      model: ollama_chat/llama3:latest
      api_base: http://host.docker.internal:11434

  - model_name: phi:latest
    litellm_params:
      model: ollama_chat/phi:latest
      api_base: http://host.docker.internal:11434

  # --- coding ---
  - model_name: qwen2.5-coder:7b
    litellm_params:
      model: ollama_chat/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11434

  - model_name: qwen2.5-coder:14b
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://host.docker.internal:11434

  - model_name: deepseek-coder-v2:latest
    litellm_params:
      model: ollama_chat/deepseek-coder-v2:latest
      api_base: http://host.docker.internal:11434

  # --- long context ---
  - model_name: mistral-nemo-64k:latest
    litellm_params:
      model: ollama_chat/mistral-nemo-64k:latest
      api_base: http://host.docker.internal:11434

  - model_name: mistral-nemo:12b-instruct-2407-q4_K_M
    litellm_params:
      model: ollama_chat/mistral-nemo:12b-instruct-2407-q4_K_M
      api_base: http://host.docker.internal:11434

  - model_name: mistral-nemo:latest
    litellm_params:
      model: ollama_chat/mistral-nemo:latest
      api_base: http://host.docker.internal:11434

  # --- embeddings ---
  - model_name: mxbai-embed-large:latest
    litellm_params:
      model: ollama/mxbai-embed-large:latest
      api_base: http://host.docker.internal:11434

  # --- cloud (keys from OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY in .env) ---
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
