general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true   # ignore unsupported params instead of erroring
  num_retries: 2
  callbacks: ["prometheus"]
  # Verified on main-stable: /metrics 401s without a Bearer master key by default. Prometheus
  # scrapes east-west on :4000 without one, and tls-proxy 404s /litellm/metrics on the three
  # sites (:8447, :8092 and the :8090 litellm handle), so drop the auth requirement.
  require_auth_for_metrics_endpoint: false

# No static model_list — STORE_MODEL_IN_DB=True (compose.yaml). All models are
# managed via the Admin UI (Models tab) or the /model/new API, stored in
# LiteLLM_ProxyModelTable. See memory: beeblebox-ollama-litellm /
# beeblebox-litellm-tailnet-port for how models/credentials were migrated here.
