# LiteLLM OpenAI-compatible proxy → local Ollama. HTTP: :4000 | HTTPS: :8447
services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - litellm-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "${HOST_INTERNAL_IP:?HOST_INTERNAL_IP must be set in .env}:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY must be set in .env}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-darraghog}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:-}
      PROXY_BASE_URL: ${LITELLM_PROXY_BASE_URL:-https://localhost:8447}
      STORE_MODEL_IN_DB: "True"
      # Serve the whole app (UI, assets and API) under /litellm so it can be path-mounted
      # on the :8090 tailnet router. The 2026-08-13 investigation ruled out a path mount by
      # grepping the UI bundle for a *client-side* base path and finding none; this is the
      # server-side setting it did not try. Until the Caddy rewrites land, this moves the
      # :8447 and :8092 mounts to /litellm/... too — see docs/NETWORK-CONFIG.md.
      SERVER_ROOT_PATH: /litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/litellm/health/liveliness', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  litellm-postgres: {}
