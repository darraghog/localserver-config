# Caddy TLS proxy. Run bootstrap-tls.sh first. HTTPS: :8443 (hello-world), :8444 (n8n)
services:
  caddy:
    image: docker.io/library/caddy:alpine
    volumes:
      - ../../certs:/certs:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./router-static:/srv/router:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      # Backends published under p-open-east-west live on a per-host address; the Caddyfile
      # reads it as {env.HOST_INTERNAL_IP}. Fail loudly rather than proxying to ":PORT".
      HOST_INTERNAL_IP: ${HOST_INTERNAL_IP:?HOST_INTERNAL_IP must be set in .env}
      # homelab-arch's :8099 / :8105 sites (see compose/homelab-arch/README.md). Read as
      # {env.*} placeholders (the token per request, the hash at config load), so the values
      # never enter the config the admin API returns. The defaults keep Caddy starting on hosts that do not run homelab-arch
      # (an EMPTY hash makes Caddy refuse to start, taking every site down): no approver token
      # (the app refuses an empty one) and a lock-out hash, the bcrypt of a random secret that
      # was discarded when it was generated, so :8099 answers 401 to every password.
      HLA_APPROVER_TOKEN: ${HLA_APPROVER_TOKEN:-}
      HLA_BASIC_AUTH_HASH: ${HLA_BASIC_AUTH_HASH:-JDJhJDE0JDN6RTlhbmxvdjRuZUtSelF2SDBPbHVHMjNIYS43LzhYdk9YVGhDQ3AxdWYuSHo3dWkzNDRl}
      HLA_HUMAN_AUTH: ${HLA_HUMAN_AUTH:-basic}
    restart: unless-stopped
    init: true
    network_mode: host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
