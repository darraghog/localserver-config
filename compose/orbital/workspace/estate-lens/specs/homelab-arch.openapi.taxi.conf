// BEEBLEBOX variant of workspace/estate-lens/specs/homelab-arch.openapi.taxi.conf (do not edit the dev one).
// Copy over the dev file in the stack's workspace/estate-lens/specs/ at deploy time (RUNBOOK step 2).
// D1(a): unauthenticated web spec, no credentials in this file. Podman injects host.containers.internal,
// which resolves to the host-internal address where homelab-arch publishes :8104.
defaultNamespace: "homelab.api"
serviceBasePath: "http://host.containers.internal:8104"
