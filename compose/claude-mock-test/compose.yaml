services:
  app:
    build: .
    # Loopback only: reached through Caddy (:8446 LAN TLS, /claudemock on the :8090
    # tailnet router), never directly.
    ports:
      - "${HOST_INTERNAL_IP:?HOST_INTERNAL_IP must be set in .env}:8093:80"
    restart: unless-stopped
    healthcheck:
      test: "wget -qO- http://127.0.0.1/ || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
