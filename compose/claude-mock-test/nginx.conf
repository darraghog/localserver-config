server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Filenames never change between deploys, so heuristic browser caching would happily
    # keep serving a stale question bank after an update. Always revalidate.
    add_header Cache-Control "no-cache, must-revalidate" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
