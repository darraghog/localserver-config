groups:
  - name: availability
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alerting pipeline heartbeat"
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Scrape target down: {{ $labels.job }} {{ $labels.instance }}"
      - alert: ProbeDown
        expr: probe_success{job!="tls-cert"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Probe failing: {{ $labels.instance }}"
      - alert: EndpointSlow
        expr: probe_duration_seconds{job!="tls-cert"} > 5
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Endpoint slow (>5s): {{ $labels.instance }}"

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Prometheus config reload failed"
      - alert: AlertmanagerConfigReloadFailed
        expr: alertmanager_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Alertmanager config reload failed"

  - name: certificates
    rules:
      - alert: CertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="tls-cert"} - time()) < 14 * 86400
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in under 14 days"
      - alert: CertExpiryCritical
        expr: (probe_ssl_earliest_cert_expiry{job="tls-cert"} - time()) < 3 * 86400
        for: 1h
        labels:
          severity: page
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in under 3 days"

      - alert: TlsProbeMissing
        expr: absent(probe_ssl_earliest_cert_expiry{job="tls-cert"})
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "TLS expiry probe is not producing data"
      - alert: TlsProbeFailing
        expr: probe_success{job="tls-cert"} == 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "TLS expiry probe failing: {{ $labels.instance }}"

  - name: host
    rules:
      - alert: HostDiskFilling
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Root filesystem has under 15% free"
      - alert: HostDiskFillingFast
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "Root filesystem predicted full within 24h"
      - alert: HostMemoryHigh
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Host has under 10% memory available"
      - alert: HostCpuHigh
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Host CPU over 90% for 15m"

  - name: systemd
    rules:
      # Fed by scripts/emit-unit-metrics.sh via node-exporter's textfile collector. A oneshot
      # user unit that fails just sits in "failed": the weekly backup did so for three weeks.
      - alert: SystemdUserUnitFailed
        expr: localserver_systemd_user_unit_failed == 1
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "systemd user unit failed: {{ $labels.unit }}"
      # If the emitter stops, "no failed units" and "not checking" look identical.
      # node-exporter labels the metric with the full in-container path, hence the regex.
      - alert: SystemdUnitMetricsStale
        expr: time() - node_textfile_mtime_seconds{file=~".*/systemd_user_units.prom"} > 300
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "systemd user unit metrics are stale, so failed units would go unreported"
      - alert: SystemdUnitMetricsMissing
        expr: absent(node_textfile_mtime_seconds{file=~".*/systemd_user_units.prom"})
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "no systemd user unit metrics: is localserver-unit-metrics.timer running?"
